<style>
:root{
  --bg:#090b14; --bg2:#10142a; --panel:#141936; --line:#262d55; --fg:#f3f5ff; --muted:#9097c0;
  --gold:#ffc93c; --gold-ink:#1b1300; --good:#33d17a; --bad:#ff5d5d; --red:#ff5d5d; --blue:#4dabff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:var(--fg);background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:.8em .9em;width:100%;min-width:0}
.hidden{display:none!important}
.muted{color:var(--muted)}
.disp{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;border-radius:14px;padding:.75em 1.1em;font-weight:700;font-size:1rem;background:var(--panel);border:2px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.big{font-size:1.2rem;padding:.95em 1.2em;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:.35em;padding:.45em .8em;border-radius:99px;border:2px solid var(--line);background:var(--bg2);font-weight:700;font-size:.9rem}
.chip.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.setrow{display:flex;flex-wrap:wrap;gap:.4em;align-items:center;margin:.35em 0}
.setrow b{width:100%;font-size:.85em;color:var(--muted);font-weight:700}
.note{font-size:.9em;color:var(--muted);line-height:1.4}

/* TV */
body.tv{overflow:hidden;font-size:clamp(13px,1.15vw,24px)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:1em;padding:1.6vh 2.4vw;pointer-events:none;z-index:2}
.logo{font-family:var(--display);font-weight:800;font-size:2.2em;text-transform:uppercase;letter-spacing:.02em;text-shadow:0 .1em .3em rgba(0,0,0,.5)}
.logo span{color:var(--gold)}
.ginfo{font-family:var(--display);font-weight:800;font-size:1.6em;text-transform:uppercase;letter-spacing:.04em;text-shadow:0 .1em .3em rgba(0,0,0,.6);text-align:center}
.codesm{font-weight:700;color:var(--muted);text-shadow:0 .1em .3em rgba(0,0,0,.6)} .codesm b{color:var(--fg);font-family:var(--display);font-size:1.5em;letter-spacing:.1em}
.layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:9vh 3vw 3vh;z-index:1}
.layer.pe-none{pointer-events:none}
.lobby{display:flex;gap:3vw;align-items:stretch;width:100%;max-width:120em;height:100%}
.lobby .left{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center}
.lobby h1{font-family:var(--display);font-weight:800;font-size:5.4em;text-transform:uppercase;margin:0;line-height:.9}
.lobby h1 span{color:var(--gold)}
.qr{background:#fff;padding:1.2vh;border-radius:1.2vh;line-height:0}
.qr img,.qr canvas{width:32vh!important;height:32vh!important}
.code{font-family:var(--display);font-weight:800;font-size:4em;letter-spacing:.1em;line-height:1}
.panel{width:min(26em,34vw);display:flex;flex-direction:column;gap:.9em;min-height:0;overflow:auto;padding:1.2em;background:rgba(16,20,42,.88);border:2px solid var(--line);border-radius:1em}
.panel h3{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.6em;color:var(--gold)}
.plist{display:flex;flex-direction:column;gap:.45em}
.prow{display:flex;align-items:center;gap:.6em;padding:.45em .7em;border-radius:.7em;background:var(--panel);border:2px solid var(--line)}
.prow .dot{width:1em;height:1em;border-radius:50%;flex:none}
.prow .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .sc{font-family:var(--display);font-weight:800;font-size:1.5em;color:var(--gold)}
.prow.off{opacity:.45}
.tag{font-size:.75em;font-weight:700;padding:.1em .5em;border-radius:99px;background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.card{background:rgba(16,20,42,.94);border:3px solid var(--line);border-radius:1.4em;padding:2.4em 3em;text-align:center;max-width:60em;box-shadow:0 2em 5em rgba(0,0,0,.55);animation:pop .3s}
.card .em{font-size:6em;line-height:1}
.card h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:4em;margin:.1em 0 .2em;color:var(--gold);line-height:.95}
.card p{font-size:1.5em;line-height:1.35;margin:.4em 0}
.card .kidtip{font-size:1.15em;color:var(--muted)}
.count{font-family:var(--display);font-weight:800;font-size:2em;color:var(--gold);margin-top:.6em}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.board{display:flex;flex-direction:column;gap:.7em;min-width:34em;margin-top:1em;text-align:left}
.brow{display:flex;align-items:center;gap:.8em;font-size:1.4em}
.brow .nm{width:7em;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bar{flex:1;height:1.4em;border-radius:.4em;background:var(--panel);overflow:hidden}
.brow .bar i{display:block;height:100%;border-radius:.4em;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.brow .pts{width:3.2em;text-align:right;font-family:var(--display);font-weight:800;font-size:1.3em;color:var(--gold)}
.brow .plus{width:3em;color:var(--good);font-weight:800}
.tvbtns{display:flex;gap:.8em;justify-content:center;margin-top:1.2em}

/* Phone */
body.ph{overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.pw{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.ptop{display:flex;align-items:center;gap:.6em;padding:.65em 1em;background:var(--bg2);border-bottom:2px solid var(--line);flex:none}
.ptop .dot{width:1.1em;height:1.1em;border-radius:50%;flex:none}
.ptop .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:.8rem;font-weight:800;padding:.25em .6em;border-radius:99px;background:var(--panel);border:2px solid var(--line);white-space:nowrap}
.pbody{flex:1;display:flex;flex-direction:column;gap:1em;padding:1em;overflow:auto;min-height:0}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.7em}
.center h2{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:2.2rem;line-height:.95}
.bigemoji{font-size:6rem;line-height:1}
.ctl{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.area{position:relative;flex:1;margin:1em;border-radius:1.2em;background:var(--panel);border:2px dashed var(--line);overflow:hidden;touch-action:none}
.area .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:1.5em;color:var(--muted);pointer-events:none;line-height:1.4}
.knob,.base{position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
.base{width:150px;height:150px;border:3px solid var(--line);background:rgba(255,255,255,.04)}
.knob{width:68px;height:68px;background:var(--gold);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.bigbtn{margin:0 1em 1em;height:6.5rem;border-radius:1.4em;background:var(--gold);color:var(--gold-ink);font-family:var(--display);font-weight:800;font-size:2.4rem;box-shadow:0 6px 0 #b8860b;touch-action:none;flex:none;position:relative;overflow:hidden}
.bigbtn.down{transform:translateY(5px);box-shadow:0 1px 0 #b8860b}
.bigbtn .cool{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.25);pointer-events:none}
.tapzone{flex:1;margin:1em;border-radius:1.6em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;font-family:var(--display);font-weight:800;text-transform:uppercase;touch-action:none;user-select:none;-webkit-user-select:none;transition:background .08s}
.tapzone .big{font-size:4.4rem;line-height:1}
.tapzone .sub{font-family:var(--body);text-transform:none;font-size:1.1rem;font-weight:700;opacity:.85}
.tapzone.pressed{transform:scale(.98)}
.swipe{flex:1;margin:1em;border-radius:1.4em;background:linear-gradient(180deg,#dff1ff,#b9dcf5);position:relative;overflow:hidden;touch-action:none}
.swipe .stone{position:absolute;left:50%;bottom:12%;width:5.5rem;height:5.5rem;border-radius:50%;transform:translate(-50%,0);background:radial-gradient(circle at 40% 35%,#c9ccd6,#7c8191 70%,#5d6271);box-shadow:0 .4rem 1rem rgba(0,0,0,.35);pointer-events:none}
.swipe .stone i{position:absolute;left:30%;right:30%;top:42%;height:16%;border-radius:.4rem}
.swipe .arrow{position:absolute;left:50%;top:10%;transform:translateX(-50%);font-size:3.5rem;color:#1d3d5c;animation:bob 1s ease-in-out infinite;pointer-events:none}
.swipe .lbl{position:absolute;left:0;right:0;top:34%;text-align:center;color:#1d3d5c;font-weight:800;font-size:1.3rem;pointer-events:none}
@keyframes bob{50%{transform:translate(-50%,-.6rem)}}
.flash{animation:fl .3s}
@keyframes fl{from{box-shadow:inset 0 0 0 8px var(--gold)}to{box-shadow:inset 0 0 0 0 transparent}}
.check{display:flex;gap:.7em;align-items:center;padding:.9em 1em;border-radius:12px;background:var(--bg2);border:2px solid var(--line);font-weight:700;text-align:left}
.check input{width:1.6em;height:1.6em;flex:none}
.home{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:1rem;padding:1.5rem;max-width:30rem;margin:0 auto;position:relative;z-index:1}
.home h1{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:3.4rem;margin:0;line-height:.9}
.home h1 span{color:var(--gold)}
.home p{margin:0;line-height:1.4}
.toast{position:fixed;left:50%;top:20%;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-weight:800;font-size:1.3rem;padding:.6em 1.2em;border-radius:99px;z-index:9;animation:pop .2s}
.bar2{display:flex;align-items:center;gap:.6em;font-weight:700;font-size:.9rem}
.bar2 span{width:6.5em;color:var(--muted)}
.bar2 b{flex:1;height:1rem;border-radius:99px;background:var(--panel);overflow:hidden}
.bar2 i{display:block;height:100%;transition:width .15s}
.reelwrap{flex:1;display:flex;align-items:center;justify-content:center;padding:1em}
.reel{position:relative;width:min(78vw,18rem);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#1d2a55 0 30%,#2a3870 31% 64%,#141936 65%);border:6px solid #5560a8;touch-action:none;display:flex;align-items:center;justify-content:center;transition:background .15s}
.reel.fight{background:radial-gradient(circle,#5a1010 0 30%,#a51d1d 31% 64%,#3a0a0a 65%);border-color:#ff5d5d;animation:shake .3s infinite}
.reel span{font-weight:800;text-align:center;width:40%;font-size:.9rem;pointer-events:none}
.rk{position:absolute;width:3.2rem;height:3.2rem;border-radius:50%;background:var(--gold);transform:translate(-50%,-50%);box-shadow:0 3px 10px rgba(0,0,0,.5);pointer-events:none}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pcard{width:5.5rem;height:7.7rem;border-radius:.7rem;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 .4rem 1rem rgba(0,0,0,.4);font-family:var(--display)}
.pcard b{font-size:2.4rem;line-height:1}.pcard span{font-size:2.2rem;line-height:1}
.pcard.big{width:7.5rem;height:10.5rem}.pcard.big b{font-size:3.4rem}.pcard.big span{font-size:3rem}
.hl{flex:1;display:flex;flex-direction:column;gap:.8em;padding:1em}
.hlb{flex:1;border-radius:1.2em;font-family:var(--display);font-weight:800;font-size:2.4rem;color:#fff}
.hlb.up{background:#2e7d32}.hlb.down{background:#c62828}
.hlb.on{box-shadow:0 0 0 5px var(--gold)}.hlb.off{opacity:.35}
.hlist{display:flex;flex-direction:column;gap:.45em}
.hrow{display:flex;align-items:center;gap:.6em;padding:.55em .7em;border-radius:.8em;background:var(--panel);border:2px solid var(--line);text-align:left}
.hrow.on{border-color:var(--gold);background:#2a2a14}
.hrow .silk{width:1.8em;height:1.8em;border-radius:.4em;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);flex:none}
.hrow .hn{flex:1;font-weight:700}.hrow .ho{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--gold)}
.chip:disabled{opacity:.35}
/* snow (Christmas) */
.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.snow i{position:absolute;top:-2vh;border-radius:50%;background:#fff;opacity:.75;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),105vh)}}
</style>

// ===================================================================

const SUPA_URL = "https://uqwlmegbelyqtbegxqlz.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxd2xtZWdiZWx5cXRiZWd4cWx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NTYzNzAsImV4cCI6MjEwNzMzMjM3MH0.bSeF8_kwKqSrEj3n8Ku2OeSU8E5nMqJj0hcfgXb8cW0";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const COLORS = ["#ff6b6b", "#4dabff", "#ffd43b", "#51e08a", "#c792ff", "#ff9f43", "#3ee6d6", "#ff7ac0", "#b5e853", "#a5b4cc"];
const T = () => performance.now();

const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };

const INFO = {
  sumo: { t: "Penguin Sumo", e: "🐧", how: "Waddle with the joystick and press DASH to barge. Push everyone off the ice. Last penguin standing wins the round. 3 rounds!", kid: "Kids are bigger, heavier penguins." },
  curl: { t: "Curling", e: "🥌", how: "On your turn, swipe UP on your phone to slide your stone. Then tap SWEEP fast to make it go further. Closest to the middle wins!", kid: "Kids get help with their power." },
  tug: { t: "Tug of War", e: "💪", how: "Two teams. Tap as fast as you can to pull the rope your way. Best of 3 pulls!", kid: "Kids' taps count extra." },

  fish: { t: "Gone Fishing", e: "🎣", how: "Swipe up to cast. Wait for a proper BITE, not a nibble, then tap HOOK. Wind your finger round the reel, but stop when it fights or the line snaps! Most points of fish in 100 seconds wins.", kid: "Kids get longer to hook and stronger lines." },

const GAME_IDS = ["sumo", "tug", "draw", "curl", "boat", "fish", "cards", "derby"];
const PTS = [10, 7, 5, 4, 3, 2];
function setsHTML(st) {
  return `<div class="setrow"><b>Games (tap to include)</b>${GAME_IDS.map(g => `<button class="chip ${st.games.includes(g) ? "on" : ""}" data-game="${g}">${INFO[g].e} ${INFO[g].t}</button>`).join("")}</div>
    <div class="setrow"><b>Theme</b><button class="chip ${st.theme === "std" ? "on" : ""}" data-set="theme" data-val="std">Standard</button><button class="chip ${st.theme === "xmas" ? "on" : ""}" data-set="theme" data-val="xmas">🎄 Christmas</button></div>
    <div class="setrow"><b>🤖 Computer players</b>${[["auto", "Auto"], [0, "None"], [1, "1"], [2, "2"], [3, "3"]].map(([v, t]) => `<button class="chip ${st.bots === v ? "on" : ""}" data-set="bots" data-val="${v}">${t}</button>`).join("")}</div>

    <div class="note">Kids boost gives players who ticked “a child is playing” a fair chance: heavier penguins, extra-strong taps, a head start in Quick Draw and help with curling power.</div>`;

function readSet(e) {
  const g = e.target.closest("[data-game]"); if (g) return { k: "game", v: g.dataset.game };

  const k = b.dataset.set, v = b.dataset.val;
  return { k, v: k === "boost" ? v === "1" : k === "bots" ? (v === "auto" ? "auto" : +v) : v };
}

// ===== transport =====
let sb = null;
async function chan(name, onMsg) {
  if (LOCAL) { const bc = new BroadcastChannel(name); bc.onmessage = e => onMsg(e.data); return { send: m => bc.postMessage(m), close: () => bc.close() }; }

        ctl.innerHTML = h ? `<div class="tapzone" id="ch" style="background:${SILKS[b.h]};color:${b.h === 2 ? "#1b1300" : "#fff"}"><div class="sub" style="font-size:1.2rem">Your horse: #${b.h + 1} ${esc(h.n)}</div><div class="big">CHEER!</div><div class="sub">${b.s} coins at ${h.o}. Tap to cheer it on!</div></div>`
          : `<div class="center"><div class="bigemoji">🏇</div><h2>No bet this race</h2><p class="muted">Watch the TV!</p></div>`;
        const z = $("#ch"); if (z) z.onpointerdown = e => { e.preventDefault(); if (Date.now() - cheerAt > 120) { cheerAt = Date.now(); send({ t: "cheer" }); vib(6); } };
      } else if (g.state === "result") {
        const w = g.win, won = (g.wins || {})[id] || 0;
        ctl.innerHTML = `<div class="center"><div class="bigemoji">${won ? "🤑" : "🏇"}</div><h2>${won ? `You won ${won} coins!` : myBet ? "Unlucky!" : "No bet"}</h2><p class="muted">Winner: #${w + 1} ${esc(g.horses[w].n)} at ${g.horses[w].o}</p><p style="font-size:1.3rem;font-weight:800;color:var(--gold)">💰 ${coins} coins</p></div>`;
      } else ctl.innerHTML = `<div class="center"><div class="bigemoji">💰</div><h2>${coins} coins</h2><p class="muted">Final results on the TV</p></div>`;
    }
  }
  function paintDerby(g) {
    document.querySelectorAll("[data-h]").forEach(b => b.classList.toggle("on", +b.dataset.h === derbyH));
    document.querySelectorAll("[data-s]").forEach(b => b.classList.toggle("on", +b.dataset.s === derbyS));
    const info = $("#dinfo"); if (!info) return;
    if (derbyH != null && derbyS > 0) { const h = g.horses[derbyH]; info.textContent = `${derbyPlaced === g.race ? "✔ Bet placed: " : ""}${derbyS} on ${h.n} at ${h.o}. Wins ${Math.round(derbyS * h.d)} coins.${derbyPlaced === g.race ? " You can still change it." : ""}`; }
    else info.textContent = "Tap a horse, then a stake.";
  }

  function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1300); }

  // ---------- send loops ----------
  function tick() {
    if (ST && ST.phase === "play" && ST.game === "boat" && boatMode) {
      const now = Date.now(), lv = boatLevel(), l = $("#bzl"); if (l) l.style.width = (lv * 100) + "%";
      if (ST.g && ST.g.state === "race" && now - lastBlow >= (dcOpen() ? 50 : 80)) { lastBlow = now; send({ t: "blow", v: Math.round(lv * 100) / 100 }); }
    }
    if (reelAcc > .02 && Date.now() - lastBlow >= 80) { lastBlow = Date.now(); send({ t: "reel", a: Math.round(reelAcc * 100) / 100 }); reelAcc = 0; }
    if (ST && ST.phase === "play" && ST.game === "sumo") {
      const now = Date.now(), gap = dcOpen() ? 30 : 66;
      if ((joy.x !== sent.x || joy.y !== sent.y || now - sent.t > 500) && now - sent.t >= gap) { send({ t: "joy", x: joy.x, y: joy.y }); sent.x = joy.x; sent.y = joy.y; sent.t = now; }
    }
  }
  setInterval(tick, 30);
  setInterval(() => { if (tapN) { const n = Math.min(tapN, 4); tapN = 0; send({ t: "taps", n }); } }, 100);
  setInterval(() => { const c = $("#cnt"); if (c) upd(role()); }, 500);

  // ---------- start ----------
  if (!me) joinForm(); else render();
  try { own = await chan("party-" + room + "-" + id, onPrivate); mainCh = await chan("party-" + room, onMain); }
  catch (e) { app.innerHTML = `<div class="home"><h2>Couldn't connect</h2><p class="muted">Check your internet and try again.</p><button class="btn gold" onclick="location.reload()">Try again</button></div>`; return; }
  join();
  setInterval(() => {
    if (!me) return;
    if (Date.now() - lastState > 8000 || !welcomed) { welcomed = welcomed && Date.now() - lastState <= 8000; join(); }
    else send({ t: "hi" });
  }, 2500);
  try { if (navigator.wakeLock) { let wl = await navigator.wakeLock.request("screen"); document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible") try { wl = await navigator.wakeLock.request("screen"); } catch (e) { } }); } } catch (e) { }
}
</script>
</body>
</html>
