<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b14">
<title>Buzz In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#090b14; --bg2:#10142a; --panel:#141936; --line:#262d55; --fg:#f3f5ff; --muted:#9097c0;
  --gold:#ffc93c; --gold-ink:#1b1300; --good:#33d17a; --bad:#ff5d5d;
  --a:#e5484d; --b:#3e8ef7; --c:#e3a90b; --d:#26a96c;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--fg);background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:.7em .9em;width:100%;min-width:0}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
.disp{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;border-radius:14px;padding:.8em 1.2em;font-weight:700;font-size:1rem;background:var(--panel);border:2px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.good{background:var(--good);color:#04210f;border-color:var(--good)}
.btn.bad{background:var(--bad);color:#2a0000;border-color:var(--bad)}
.btn.big{font-size:1.25rem;padding:1em 1.4em;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.45em .8em;border-radius:99px;border:2px solid var(--line);background:var(--bg2);font-weight:600;font-size:.9rem}
.chip.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.chip.off{opacity:.5}
.chip small{font-weight:500;opacity:.75}

/* ============ TV ============ */
body.tv{font-size:1.45vw;overflow:hidden;background:
  radial-gradient(60vw 40vw at 50% -10%, #23307a 0%, transparent 70%),
  radial-gradient(40vw 30vw at 100% 100%, #3a1450 0%, transparent 70%), var(--bg)}
@media (max-aspect-ratio:4/3){body.tv{font-size:2.2vw}}
.tv .stage{position:fixed;inset:0;padding:2.2rem 3rem;display:flex;flex-direction:column;gap:1.4rem}
.tv .top{display:flex;align-items:center;justify-content:space-between;gap:1.5rem}
.tv .brand{font-size:2rem;color:var(--gold)}
.tv .crumbs{font-size:1.1rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tv .conn{font-size:.8rem;color:var(--muted)}
.tv .center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.6rem;text-align:center;min-height:0}
.tv .qtext{font-family:var(--display);font-weight:700;font-size:3.6rem;line-height:1.05;max-width:85%;text-wrap:balance}
.tv .emoji{font-size:9rem;line-height:1;letter-spacing:.1em}
.tv .opts{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;width:100%}
.tv .opts.two{grid-template-columns:1fr 1fr}
.tv .opt{position:relative;border-radius:1.2rem;padding:1.3rem 1.6rem;display:flex;align-items:center;gap:1.2rem;font-size:2rem;font-weight:700;text-align:left;min-height:6.5rem;transition:opacity .3s,transform .3s}
.tv .opt .let{font-family:var(--display);font-weight:800;font-size:2.6rem;width:3.4rem;height:3.4rem;border-radius:.8rem;background:rgba(0,0,0,.22);display:grid;place-items:center;flex:none}
.tv .opt .who{position:absolute;right:1rem;bottom:.6rem;display:flex;gap:.3rem}
.tv .opt.dim{opacity:.22}
.tv .opt.right{transform:scale(1.03);box-shadow:0 0 0 .35rem #fff, 0 0 3rem rgba(255,255,255,.35)}
.o0{background:var(--a)}.o1{background:var(--b)}.o2{background:var(--c)}.o3{background:var(--d)}
.tv .bottom{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:3.4rem}
.tv .dots{display:flex;gap:.6rem;flex-wrap:wrap}
.dot{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1rem;color:#111;border:.18rem solid transparent;opacity:.35;transition:opacity .2s,transform .2s}
.dot.in{opacity:1;transform:scale(1.08);border-color:#fff}
.mini{width:1.7rem;height:1.7rem;border-radius:50%;display:inline-grid;place-items:center;font-size:.75rem;font-weight:800;color:#111;border:2px solid #fff}
.tv .timer{position:relative;width:6rem;height:6rem;flex:none}
.tv .timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.tv .timer .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:2.6rem}
.tv .ctl{display:flex;gap:.6rem;opacity:.55}
.tv .ctl:hover{opacity:1}
.tv .ctl .btn{font-size:.85rem;padding:.5em .9em}
/* lobby */
.tv .lobby{flex:1;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:2.4rem;min-height:0}
.tv .joincard{display:flex;flex-direction:column;justify-content:center;gap:1.2rem}
.tv .logo{font-size:7rem;color:var(--gold);text-shadow:0 .4rem 0 #7a4b00}
.tv .code{font-family:var(--display);font-weight:800;font-size:6.5rem;letter-spacing:.18em;line-height:1}
.tv .qrrow{display:flex;gap:1.6rem;align-items:center}
.tv .qr{background:#fff;padding:.8rem;border-radius:1rem;width:13rem;height:13rem;flex:none}
.tv .qr img,.tv .qr canvas{width:100%!important;height:100%!important}
.tv .side{display:flex;flex-direction:column;gap:1.2rem;min-height:0}
.tv .players{display:flex;flex-wrap:wrap;gap:.8rem;align-content:flex-start}
.ptile{display:flex;align-items:center;gap:.7rem;background:var(--panel);border:2px solid var(--line);border-radius:1rem;padding:.6rem 1rem .6rem .6rem;font-weight:700;font-size:1.2rem;animation:pop .35s ease-out}
.ptile .av{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;color:#111;font-weight:800}
.ptile small{display:block;font-weight:500;font-size:.8rem;color:var(--muted)}
.ptile.off{opacity:.45}
.tv .setup{background:rgba(20,25,54,.75);border:2px solid var(--line);border-radius:1.2rem;padding:1.2rem;display:flex;flex-direction:column;gap:.9rem;font-size:.9rem}
.setrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.setrow > b{min-width:7.5em;font-size:.85em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hostbox{display:flex;align-items:center;gap:1rem}
.hostbox .qr{width:6.5rem;height:6.5rem;padding:.4rem}
/* intro */
.tv .rnum{font-size:1.6rem;color:var(--muted);letter-spacing:.2em}
.tv .rtitle{font-size:8rem;color:var(--gold)}
.tv .rblurb{font-size:2rem;color:var(--fg);max-width:70%}
.tv .dbl{font-family:var(--display);font-weight:800;font-size:2.2rem;background:var(--gold);color:var(--gold-ink);padding:.2em .7em;border-radius:.4em;transform:rotate(-3deg)}
/* reveal */
.tv .bigans{font-family:var(--display);font-weight:800;font-size:6rem;color:var(--gold);line-height:1}
.tv .glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(18rem,1fr));gap:.7rem;width:100%;max-width:70rem}
.grow{display:flex;align-items:center;justify-content:space-between;gap:.8rem;background:var(--panel);border-radius:.9rem;padding:.6rem 1rem;font-size:1.3rem;font-weight:700}
.grow .gain{color:var(--good)}
/* buzz */
.tv .buzzer{font-family:var(--display);font-weight:800;font-size:7rem;padding:.2em .6em;border-radius:.3em;color:#111;animation:pop .3s ease-out}
/* scores */
.tv .board{width:100%;max-width:70rem;display:flex;flex-direction:column;gap:.7rem}
.brow{display:grid;grid-template-columns:3rem minmax(0,14rem) 1fr 6rem;align-items:center;gap:1rem;font-size:1.5rem;font-weight:700}
.brow .bar{height:2.4rem;border-radius:.6rem;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.brow .sc{text-align:right;font-family:var(--display);font-size:2rem;font-variant-numeric:tabular-nums}
.brow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* podium */
.podium{display:flex;align-items:flex-end;gap:1.4rem;justify-content:center}
.pod{display:flex;flex-direction:column;align-items:center;gap:.6rem;width:15rem}
.pod .blk{width:100%;border-radius:1rem 1rem 0 0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:4rem;color:rgba(0,0,0,.55)}
.pod .pn{font-size:1.8rem;font-weight:800;text-align:center}
.pod .ps{font-size:1.3rem;color:var(--muted)}
#confetti{position:fixed;inset:0;pointer-events:none}
.toast{position:fixed;left:50%;top:1.2rem;transform:translateX(-50%);background:var(--panel);border:2px solid var(--line);padding:.6rem 1.1rem;border-radius:99px;font-weight:600;z-index:50;font-size:.95rem}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ PHONE ============ */
body.phone{font-size:16px}
.ph{min-height:100%;display:flex;flex-direction:column;gap:16px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ph.withbar{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.ph .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ph .hd .disp{font-size:26px;color:var(--gold)}
.ph .me{display:flex;align-items:center;gap:8px;font-weight:700}
.ph .card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ph h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:34px;line-height:1;margin:0}
.ph p{margin:0;line-height:1.45}
.ph label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;color:var(--muted)}
.ph .grow1{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.ph .answers{display:grid;gap:12px}
.ph .ans{border-radius:18px;padding:18px;font-size:20px;font-weight:700;display:flex;align-items:center;gap:14px;text-align:left;min-height:76px;color:#fff}
.ph .ans .let{font-family:var(--display);font-weight:800;font-size:28px;width:44px;height:44px;border-radius:10px;background:rgba(0,0,0,.22);display:grid;place-items:center;flex:none}
.ph .ans:active{transform:scale(.98)}
.ph .tfb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph .tfb .ans{justify-content:center;min-height:140px;font-size:28px;font-family:var(--display);text-transform:uppercase}
.ph .buzzbtn{width:72vw;max-width:300px;aspect-ratio:1;border-radius:50%;margin:0 auto;background:radial-gradient(circle at 35% 30%,#ff8a8a,#d81f2a 60%,#8a0c12);box-shadow:0 12px 0 #5a070b,0 18px 40px rgba(0,0,0,.5);font-family:var(--display);font-weight:800;font-size:56px;color:#fff;text-transform:uppercase}
.ph .buzzbtn:active{transform:translateY(8px);box-shadow:0 4px 0 #5a070b}
.ph .buzzbtn:disabled{filter:grayscale(1);opacity:.5}
.ph .result{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:64px;line-height:1;text-align:center}
.ph .center{text-align:center}
.ph .qsmall{font-size:20px;font-weight:700;line-height:1.3}
.ph .row{display:flex;gap:10px;flex-wrap:wrap}
.ph .row > *{flex:1 1 auto}
.ph .codein{font-family:var(--display);font-size:44px;font-weight:800;text-align:center;letter-spacing:.2em;text-transform:uppercase}
.ph .numin{font-family:var(--display);font-size:44px;font-weight:800;text-align:center}
.hbar{position:fixed;left:0;right:0;bottom:0;background:rgba(16,20,42,.97);border-top:2px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;z-index:20}
.hbar .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.hbar .row{display:flex;gap:8px}
.hbar .row .btn{flex:1;padding:.75em .6em}
.anskey{background:#2a2200;border:2px solid var(--gold);color:var(--gold);border-radius:12px;padding:10px 12px;font-weight:700}
.plist{display:flex;flex-direction:column;gap:8px}
.plist .pi{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:12px;padding:8px 10px;font-weight:600}
.plist .pi .x{margin-left:auto;color:var(--muted);font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.ph .setup{display:flex;flex-direction:column;gap:12px}
.ph .setrow > b{min-width:100%}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* landing */
.land{max-width:520px;margin:0 auto}
.land .logo{font-size:64px;color:var(--gold);text-shadow:0 5px 0 #7a4b00;text-align:center;margin-top:24px}

</style>
</head>

// ===== TRANSPORT =====
async function connect(room, onMsg, onStatus) {
  if (LOCAL) {
    const bc = new BroadcastChannel("buzzin-" + room);
    bc.onmessage = e => onMsg(e.data);
    onStatus && onStatus("ok");
    return { send: m => bc.postMessage(m) };
  }
  if (!window.supabase || SUPA_URL.startsWith("%%")) throw new Error("Live sync isn't set up yet.");
  const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, { realtime: { params: { eventsPerSecond: 30 } } });
  const ch = sb.channel("buzzin-" + room, { config: { broadcast: { self: false } } });
  ch.on("broadcast", { event: "m" }, ({ payload }) => onMsg(payload));
  await new Promise((res, rej) => {
    let done = false;
    ch.subscribe(st => {
      if (st === "SUBSCRIBED") { onStatus && onStatus("ok"); if (!done) { done = true; res(); } }
      else if (st === "CHANNEL_ERROR" || st === "TIMED_OUT" || st === "CLOSED") { onStatus && onStatus("lost"); if (!done) { done = true; rej(new Error(st)); } }
    });
  });
  return { send: m => ch.send({ type: "broadcast", event: "m", payload: m }) };
}

  async function aiRound(topic, n) {
    const key = ls.get("buzzin_key", "");
    if (!key || !topic) throw new Error("no key or topic");
    const prompt = `Write ${n} multiple-choice pub quiz questions about "${topic}" for a family quiz night in Wales, UK. Mix easy and medium. Facts must be accurate and not time-sensitive. Each question needs exactly one correct answer and three plausible wrong answers, all short (under 6 words). Reply with ONLY a JSON array, no other text: [{"q":"...","a":"correct","w":["wrong1","wrong2","wrong3"]}]`;
    const r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: CLAUDE_MODEL, max_tokens: 2500, messages: [{ role: "user", content: prompt }] }),
    });
    if (!r.ok) throw new Error("API " + r.status);
    const j = await r.json(); const txt = j.content.map(c => c.text || "").join("");
    const arr = JSON.parse(txt.slice(txt.indexOf("["), txt.lastIndexOf("]") + 1));
    return arr.slice(0, n).map((x, i) => buildQuestion("mc", [x.q, x.a, x.w[0], x.w[1], x.w[2]], "ai" + Date.now() + i));

  async function startGame() {

    S.phase = "loading"; broadcast();
    const plan = [];
    for (const id of rounds) {
      const info = roundInfo(id);
      let qs, title = info.title, blurb = info.blurb;
      if (id === "ai") {
        try { qs = await aiRound(S.settings.aiTopic, S.settings.perRound); title = S.settings.aiTopic; blurb = "A round written just for tonight."; }
        catch (e) { toast("Couldn't write the Anything Round, so it's General Knowledge instead."); qs = pickQs("gk", S.settings.perRound); title = "General Knowledge"; blurb = PACKS.gk.blurb; }
      } else qs = pickQs(id, id === "buzz" ? Math.min(S.settings.perRound + 2, 8) : S.settings.perRound);

  function startQuestion() {

  function endQuestion() {

    const ps = playersArr();
    if (q.type === "number") {
      const guesses = ps.filter(p => S.answers[p.id]).map(p => ({ p, g: Number(S.answers[p.id].c), d: Math.abs(Number(S.answers[p.id].c) - q.answer) })).sort((a, b) => a.d - b.d);

  function questionBody(q, ph) {

  render();
  connect(S.room, onMsg, s => { conn = s; if (s === "ok" && T) T.send({ t: "state", s: pub() }); render(); })
    .then(t => { T = t; conn = "ok"; broadcast(); })
    .catch(err => { conn = "lost"; toast("Can't connect: " + err.message, 6000); render(); });
}

// ======================================================================
// PHONE — player and/or host controller
// ======================================================================
function phoneMain(room, hostKey) {
  document.body.className = "phone";
  room = room.toUpperCase();
  const pidKey = "buzzin_pid_" + room;
  // each tab gets its own player when testing locally; real phones remember their player so they can rejoin
  const idStore = LOCAL ? sessionStorage : localStorage;
  let pid = null; try { pid = idStore.getItem(pidKey); } catch (e) { }
  if (!pid) { pid = uid(); try { idStore.setItem(pidKey, pid); } catch (e) { } }
  let s = null, T = null, H = null, conn = "connecting", myAns = {}, deadline = 0, lastKey = "", joined = !!ls.get("buzzin_joined_" + room, false), showJoin = false, pendingJoin = false;
  const isHost = !!hostKey;
  const me = () => s && s.players.find(p => p.id === pid);

  function send(m) { if (T) T.send(Object.assign({ pid }, m)); }
  function cmd(c, extra) { send(Object.assign({ t: "cmd", k: hostKey, cmd: c }, extra || {})); }

  function onMsg(m) {
    if (m.t === "state") {
      s = m.s;
      if (s.q) { deadline = Date.now() + s.q.left; if (s.q.key !== lastKey) { lastKey = s.q.key; if (navigator.vibrate) navigator.vibrate(60); } }
      if (me()) pendingJoin = false;
      render();
    } else if (m.t === "hostinfo" && isHost) { H = m.h; render(); }
  }

  function playerPane() {
    const p = me(), ph = s.phase;
    const needJoin = !p && (!isHost || s.hostMode === "play" || showJoin);
    if (needJoin && pendingJoin) return `<div class="grow1 center"><div class="spin"></div><p class="muted">Joining…</p></div>`;
    if (needJoin) {
      return `<div class="card"><h2>${isHost ? "Join as a player" : "Join the quiz"}</h2>
        <label>Your name or team name<input id="j-name" maxlength="24" placeholder="e.g. Kelly, or Team Nan" autocomplete="off"></label>
        <label>Playing with anyone who hasn't got a phone? (optional)<input id="j-mem" maxlength="60" placeholder="e.g. Nan and Grandad" autocomplete="off"></label>
        <button class="btn gold big" data-a="join">Join</button></div>`;
    }
    if (!p) return "";
    const hdr = `<div class="hd"><div class="disp">Buzz In</div><div class="me"><span class="mini" style="background:${p.color}">${esc(initials(p.name))}</span>${esc(p.name)} · ${p.score}</div></div>`;
    let body = "";
    if (ph === "lobby") body = `<div class="grow1 center"><div class="result" style="color:${p.color}">You're in!</div><p class="muted">Look at the TV. The quiz starts when the host is ready.</p>${p.members ? `<p>Playing with ${esc(p.members)}</p>` : ""}</div>`;
    else if (ph === "loading") body = `<div class="grow1 center"><div class="spin"></div><p class="muted">Getting the questions ready…</p></div>`;
    else if (ph === "intro") body = `<div class="grow1 center"><p class="muted">Round ${s.round.n} of ${s.round.of}</p><h2 style="color:var(--gold);font-size:48px">${esc(s.round.title)}</h2><p>${esc(s.round.blurb)}</p>${s.round.dbl ? `<p><b style="color:var(--gold)">Double points!</b></p>` : ""}</div>`;
    else if (ph === "question") body = questionPane(p);
    else if (ph === "reveal") body = revealPane(p);
    else if (ph === "scores" || ph === "final") {
      const rk = s.players.slice().sort((a, b) => b.score - a.score), pos = rk.findIndex(x => x.id === pid) + 1;
      const ord = n => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");
      body = `<div class="grow1 center"><p class="muted">${ph === "final" ? "Final position" : "After round " + s.round.n}</p><div class="result" style="color:${p.color}">${ord(pos)}</div><p style="font-size:22px;font-weight:700">${p.score} points</p>${ph === "final" && pos === 1 ? `<p style="font-size:22px">🏆 Winner!</p>` : ""}</div>`;
    }
    return hdr + body;
  }
  function questionPane(p) {
    const q = s.q, a = myAns[q.key];
    const head = `<p class="muted">${esc(s.round.title)} · Q${q.n}/${q.of}</p><div class="qsmall">${q.emoji ? `<div style="font-size:44px">${q.emoji}</div>` : ""}${esc(q.text)}</div>`;
    if (s.round.type === "buzz") {
      const locked = s.buzz && s.buzz.locked.includes(pid), cur = s.buzz && s.buzz.cur;
      if (cur === pid) return `${head}<div class="grow1 center"><div class="result" style="color:var(--gold)">Your turn!</div><p>Say your answer out loud.</p></div>`;
      return `${head}<div class="grow1 center"><button class="buzzbtn" data-a="buzz" ${locked || cur || q.paused ? "disabled" : ""}>Buzz</button>
        <p class="muted">${locked ? "You're locked out of this one." : cur ? "Someone else buzzed…" : "First to buzz gets to answer"}</p></div>`;
    }
    if (a != null) return `${head}<div class="grow1 center"><div class="result" style="color:${p.color}">Locked in</div><p style="font-size:20px">${s.round.type === "number" ? Number(a).toLocaleString("en-GB") : esc(q.opts[a])}</p><p class="muted">Waiting for everyone else…</p></div>`;
    if (s.round.type === "number") return `${head}<div class="grow1"><input id="num-${q.key}" class="numin" type="number" inputmode="decimal" placeholder="?" autocomplete="off">${q.unit ? `<p class="center muted">${esc(q.unit)}</p>` : ""}<button class="btn gold big" data-a="num">Lock in my guess</button></div>`;
    if (q.opts.length === 2) return `${head}<div class="grow1"><div class="tfb"><button class="ans o3" data-ans="0">True</button><button class="ans o0" data-ans="1">False</button></div></div>`;
    return `${head}<div class="answers">${q.opts.map((o, i) => `<button class="ans o${i}" data-ans="${i}"><span class="let">${LET[i]}</span>${esc(o)}</button>`).join("")}</div>`;
  }
  function revealPane(p) {
    const r = s.reveal || { per: {} }, mine = r.per[pid];
    if (r.skipped) return `<div class="grow1 center"><p class="muted">Question skipped</p></div>`;
    const ok = mine && mine.ok, gain = mine ? mine.gain : 0;
    let ans = r.ansText;
    return `<div class="grow1 center"><div class="result" style="color:${ok ? "var(--good)" : gain ? "var(--gold)" : "var(--bad)"}">${ok ? "Correct!" : gain ? "Close!" : mine ? "Not this time" : "No answer"}</div>
      ${gain ? `<p style="font-size:26px;font-weight:800">+${gain}</p>` : ""}<p class="muted">The answer was</p><p style="font-size:22px;font-weight:700">${esc(ans)}</p></div>`;
  }
  function hostBar() {
    if (!isHost) return "";
    const ph = s.phase; let row = "", lbl = "";
    if (ph === "lobby") { lbl = `${s.players.length} joined`; row = `<button class="btn gold" data-h="next">Start the quiz</button>`; }
    else if (ph === "loading") { lbl = "Loading"; row = `<button class="btn" disabled>Getting questions…</button>`; }
    else if (ph === "intro") { lbl = `Round ${s.round.n}: ${s.round.title}`; row = `<button class="btn gold" data-h="next">Start round</button>`; }
    else if (ph === "question") {
      lbl = `Q${s.q.n}/${s.q.of} · ${s.answered ? s.answered.length : 0}/${s.players.length} answered`;
      if (s.buzz && s.buzz.cur) { const p = s.players.find(x => x.id === s.buzz.cur); lbl = `${p ? p.name : "Someone"} buzzed`; row = `<button class="btn good" data-h="right">Right</button><button class="btn bad" data-h="wrong">Wrong</button>`; }
      else row = `<button class="btn" data-h="pause">${s.q.paused ? "Resume" : "Pause"}</button><button class="btn" data-h="skip">Skip</button><button class="btn gold" data-h="next">Reveal</button>`;
    }
    else if (ph === "reveal") { lbl = `Q${s.q.n}/${s.q.of}`; row = `<button class="btn gold" data-h="next">Next</button>`; }
    else if (ph === "scores") { lbl = "Scores"; row = `<button class="btn gold" data-h="next">Next round</button>`; }
    else if (ph === "final") { lbl = "Game over"; row = `<button class="btn gold" data-h="next">Play again</button>`; }
    const key = H && H.ans ? `<div class="anskey">Answer: ${esc(H.ans)}</div>` : "";
    return `<div class="hbar">${key}<div class="lbl"><span>Host</span><span>${esc(lbl)}</span></div><div class="row">${row}</div></div>`;
  }
  function hostLobby() {
    if (!isHost || s.phase !== "lobby") return "";
    return `<div class="card"><h2>Game settings</h2><div class="setup" data-settings>${settingsHTML(s.settings, s.fresh, "ph")}</div>
      ${s.settings.rounds.includes("ai") ? `<p class="muted" style="font-size:14px">The Anything Round needs your Claude key saved on the TV screen.</p>` : ""}</div>
      <div class="card"><h2>Players</h2><div class="plist">${s.players.map(p => `<div class="pi"><span class="mini" style="background:${p.color}">${esc(initials(p.name))}</span>${esc(p.name)}${p.members ? ` <span class="muted">+ ${esc(p.members)}</span>` : ""}<button class="x" data-kick="${p.id}">Remove</button></div>`).join("") || `<span class="muted">Nobody yet</span>`}</div></div>`;
  }
  function render() {
    if (!s) {
      paint(app, `<div class="ph"><div class="grow1 center"><div class="logo disp" style="font-size:56px;color:var(--gold)">Buzz In</div>
        ${conn === "lost" ? `<p>Can't reach game <b>${esc(room)}</b>. Check the code on the TV.</p><a class="btn" href="${esc(baseUrl())}">Enter a different code</a>` : `<div class="spin"></div><p class="muted">Joining game ${esc(room)}…</p>`}</div></div>`);
      return;
    }
    const hostOnlyView = isHost && s.hostMode === "host" && !me() && !showJoin && s.phase !== "lobby";
    let main = "";
    if (hostOnlyView) main = hostWatch();
    else if (isHost && s.phase === "lobby" && !me() && !showJoin && s.hostMode === "host") main = `<div class="hd"><div class="disp">Buzz In</div><span class="muted">Room ${esc(s.room)}</span></div>`;
    else main = playerPane();
    paint(app, `<div class="ph ${isHost ? "withbar" : ""}">${main}${hostLobby()}</div>${hostBar()}`);
  }
  function hostWatch() {
    const ph = s.phase;
    let b = `<div class="hd"><div class="disp">Buzz In</div><span class="muted">Host · ${esc(s.room)}</span></div>`;
    if (s.q && (ph === "question" || ph === "reveal")) {
      b += `<div class="card"><p class="muted">${esc(s.round.title)} · Q${s.q.n}/${s.q.of}</p><div class="qsmall">${s.q.emoji ? s.q.emoji + " " : ""}${esc(s.q.text)}</div>${s.q.opts ? `<p class="muted">${s.q.opts.map((o, i) => (s.q.opts.length === 2 ? "" : LET[i] + ": ") + esc(o)).join(" · ")}</p>` : ""}</div>`;
    } else if (s.round) b += `<div class="card"><p class="muted">Round ${s.round.n} of ${s.round.of}</p><h2>${esc(s.round.title)}</h2></div>`;
    const rk = s.players.slice().sort((a, c) => c.score - a.score);
    b += `<div class="card"><h2>Scores</h2><div class="plist">${rk.map(p => `<div class="pi"><span class="mini" style="background:${p.color}">${esc(initials(p.name))}</span>${esc(p.name)}<span style="margin-left:auto">${s.answered && s.answered.includes(p.id) ? "✓ " : ""}${p.score}</span></div>`).join("")}</div></div>`;
    return b;
  }

  app.addEventListener("click", e => {
    const t = e.target;
    const a = t.closest("[data-a]"), ans = t.closest("[data-ans]"), h = t.closest("[data-h]"), kick = t.closest("[data-kick]");
    if (a && a.dataset.a === "join") {
      const name = ($("#j-name").value || "").trim(); if (!name) { $("#j-name").focus(); return; }
      send({ t: "join", name, members: $("#j-mem").value }); pendingJoin = true; showJoin = false; setTimeout(() => { if (!me()) { pendingJoin = false; render(); } }, 6000); wakeLock(); render(); return;
    }
    if (a && a.dataset.a === "buzz") { send({ t: "buzz", key: s.q.key }); if (navigator.vibrate) navigator.vibrate(120); return; }
    if (a && a.dataset.a === "num") {
      const v = $("#num-" + s.q.key).value; if (v === "" || !isFinite(Number(v))) return;
      myAns[s.q.key] = Number(v); send({ t: "answer", key: s.q.key, c: Number(v) }); render(); return;
    }
    if (a && a.dataset.a === "showjoin") { showJoin = true; render(); return; }
    if (ans && s && s.phase === "question") { const i = Number(ans.dataset.ans); myAns[s.q.key] = i; send({ t: "answer", key: s.q.key, c: i }); if (navigator.vibrate) navigator.vibrate(30); render(); return; }
    if (h) { const k = h.dataset.h; if (k === "right" || k === "wrong") cmd("judge", { ok: k === "right" }); else cmd(k); return; }
    if (kick) { cmd("kick", { pid: kick.dataset.kick }); return; }
    if (isHost && s && s.phase === "lobby") { const patch = settingsClick(e, s.settings); if (patch) { Object.assign(s.settings, patch); cmd("settings", { patch }); render(); } }
  });
  app.addEventListener("change", e => { if (isHost && e.target.matches("[data-aitopic]")) cmd("settings", { patch: { aiTopic: e.target.value.trim() } }); });

  render();
  connect(room, onMsg, st => { conn = st; if (st === "ok" && T) send({ t: "hello", host: isHost }); if (!s) render(); })
    .then(t => { T = t; conn = "ok"; send({ t: "hello", host: isHost }); setTimeout(() => { if (!s) { conn = "lost"; render(); } }, 8000); })
    .catch(() => { conn = "lost"; render(); });
  setInterval(() => send({ t: "hello", host: isHost }), 6000);
}

// ======================================================================
// LANDING
// ======================================================================
function landing() {
  document.body.className = "phone";
  const saved = ls.get("buzzin_tv", null), canResume = saved && saved.phase !== "final" && Date.now() - (saved.saved || 0) < 12 * 3600e3;
  app.innerHTML = `<div class="ph land"><div class="logo disp">Buzz In</div><p class="center muted">Family quiz night. The TV shows the questions, phones are the buzzers.</p>
    <div class="card"><h2>Joining a game?</h2><input id="code" class="codein" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters"><button class="btn gold big" data-a="go">Join</button></div>
    <div class="card"><h2>Hosting?</h2><p class="muted">Open this on the device connected to the TV.</p>
      <a class="btn big" href="${withLocal("?tv")}">This is the TV screen</a>
      ${canResume ? `<a class="btn big" href="${withLocal("?tv=" + saved.room)}">Resume game ${esc(saved.room)}</a>` : ""}</div></div>`;
  const go = () => { const c = ($("#code").value || "").trim().toUpperCase(); if (c.length === 4) location.href = withLocal("?join=" + c); };
  app.addEventListener("click", e => { if (e.target.closest("[data-a=go]")) go(); });
  $("#code").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}

// ===== ROUTE =====
if (P.has("tv")) tvMain();
else if (P.get("join")) phoneMain(P.get("join"));
else if (P.get("host")) phoneMain(P.get("host"), P.get("k"));
else landing();

</script>
</body>
</html>
