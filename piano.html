<style>
:root{
  --wall:#151229; --bg2:#100d20; --panel:#1f1a3a; --line:#3a3263; --fg:#f6f2ff; --muted:#b3a9d6;
  --gold:#f2c94c; --gold-ink:#231a00; --good:#33d17a; --bad:#ff5d5d; --paper:#fffdf8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Playfair Display",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--wall);color:var(--fg);font-family:var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:var(--fg);background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:.8em .9em;width:100%;min-width:0}
.hidden{display:none!important}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;border-radius:14px;padding:.75em 1.1em;font-weight:700;font-size:1rem;background:var(--panel);border:2px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.good{background:var(--good);color:#04210f;border-color:var(--good)}
.btn.bad{background:var(--bad);color:#2a0000;border-color:var(--bad)}
.btn.big{font-size:1.2rem;padding:.95em 1.2em;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.45em .8em;border-radius:99px;border:2px solid var(--line);background:var(--bg2);font-weight:700;font-size:.9rem}
.chip.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.setrow{display:flex;flex-wrap:wrap;gap:.4em;align-items:center;margin:.35em 0}
.setrow b{width:100%;font-size:.85em;color:var(--muted);font-weight:700}
.plaque{margin:0 auto;width:max-content;max-width:94%;padding:1vh 3vh 1.2vh;text-align:center;border-radius:6px;color:#2a1d02;
  background:linear-gradient(180deg,#fbe6a2,#d6ae4e 55%,#b38a2f);box-shadow:inset 0 1px 0 #fff4cc,0 1vh 2vh rgba(0,0,0,.45)}
.plaque small{display:block;font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:.7em;opacity:.75}
.plaque b{font-family:var(--serif);font-size:1.6em;font-weight:800}
.plaque .hint{font-family:var(--display);font-weight:800;font-size:1.7em;letter-spacing:.18em;margin-top:.15em;white-space:pre-wrap}

/* TV */
body.tv{overflow:hidden;font-size:clamp(13px,1.15vw,24px);background:
  radial-gradient(40vw 60vh at 50% -10%,rgba(255,220,150,.22),transparent 70%),
  radial-gradient(60vw 40vh at 50% 110%,rgba(120,80,255,.18),transparent 70%),var(--wall)}
.tvwrap{position:fixed;inset:0;display:flex;flex-direction:column;padding:2.2vh 2.6vw;gap:1.6vh}
.tvtop{display:flex;align-items:center;justify-content:space-between;gap:1em}
.logo{font-family:var(--serif);font-weight:800;font-size:2.2em;color:var(--gold);font-style:italic}
.logo span{color:var(--fg)}
.tinfo{font-family:var(--display);font-weight:800;font-size:1.3em;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.codesm{font-weight:700;color:var(--muted)} .codesm b{color:var(--fg);font-family:var(--display);font-size:1.5em;letter-spacing:.1em}
.tvmain{flex:1;min-height:0;display:flex;gap:2.6vw}
.stagecol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;min-width:0}
#stage{width:100%;max-height:64vh;aspect-ratio:16/9;border-radius:1em;background:#0d0b1c;box-shadow:0 2vh 5vh rgba(0,0,0,.5),0 0 0 3px #2c2550}
.panel{width:min(24em,30vw);display:flex;flex-direction:column;gap:1em;min-height:0;overflow:auto;padding:1.2em;background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:1em}
.panel h3{margin:0;font-family:var(--serif);font-size:1.5em;color:var(--gold)}
.qrcard{background:var(--paper);padding:3vh;border-radius:1em;box-shadow:0 2vh 5vh rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;gap:1.4vh}
.qrcard img,.qrcard canvas{width:36vh!important;height:36vh!important}
.qrcard .k{display:flex;gap:2px}
.qrcard .k i{width:2.2vh;height:5vh;background:#fff;border:1px solid #333;border-radius:0 0 3px 3px}
.qrcard .k i.b{background:#222;width:1.4vh;height:3.2vh;margin:0 -.7vh;z-index:1;border:0}
.plist{display:flex;flex-direction:column;gap:.45em}
.prow{display:flex;align-items:center;gap:.6em;padding:.45em .7em;border-radius:.7em;background:var(--panel);border:2px solid var(--line)}
.prow .dot{width:1em;height:1em;border-radius:50%;flex:none}
.prow .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .sc{font-family:var(--display);font-weight:800;font-size:1.5em;color:var(--gold)}
.prow.got{border-color:var(--good)} .prow.drawer{border-color:var(--gold)}
.prow.off{opacity:.45}
.tag{font-size:.75em;font-weight:700;padding:.1em .5em;border-radius:99px;background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.timer{font-family:var(--display);font-weight:800;font-size:3.4em;text-align:center;color:var(--gold);line-height:1}
.timer.low{color:var(--bad)}
.feed{display:flex;flex-direction:column;gap:.3em;font-size:.95em}
.feed div{padding:.3em .6em;border-radius:.5em;background:rgba(255,255,255,.05)}
.feed .ok{background:rgba(51,209,122,.18);color:#9ff0c2;font-weight:700}
.buzzov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,6,20,.6);z-index:5}
.buzzcard{background:var(--panel);border:4px solid var(--gold);border-radius:1.4em;padding:2em 3em;text-align:center;box-shadow:0 2em 4em rgba(0,0,0,.6);animation:pop .25s}
.buzzcard h2{margin:0 0 .3em;font-family:var(--serif);font-size:3em}
.buzzcard .row{display:flex;gap:1em;justify-content:center;margin-top:1.2em}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.lobbynote{font-size:.9em;color:var(--muted);line-height:1.4}
.end{flex:1;display:flex;gap:2.6vw;min-height:0}
.concert{flex:1;display:flex;flex-wrap:wrap;gap:2vh 1.6vw;align-content:center;justify-content:center;overflow:auto;padding:1vh}
.ticket{width:min(22em,40%);display:flex;align-items:center;gap:1em;padding:1em 1.2em;border-radius:1em;background:var(--panel);border:2px solid var(--line);animation:pop .4s backwards;text-align:left}
.ticket .e{font-size:3em;line-height:1}
.ticket b{display:block;font-family:var(--serif);font-size:1.3em}
.ticket .by{color:var(--muted);font-weight:700}
.ticket .pl{margin-left:auto;font-size:1.4em;width:2.4em;height:2.4em;border-radius:50%;background:var(--gold);color:var(--gold-ink);flex:none}
.ticket.playing{border-color:var(--gold)}
.podium .prow:first-child{border-color:var(--gold);background:rgba(242,201,76,.12)}
.soundov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(8,6,20,.82)}
.soundov button{font-size:2em;padding:1em 1.6em}

/* Phone */
body.ph{overflow:hidden;overscroll-behavior:none}
.pw{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.ptop{display:flex;align-items:center;gap:.6em;padding:.65em 1em;background:var(--bg2);border-bottom:2px solid var(--line);flex:none}
.ptop .dot{width:1.1em;height:1.1em;border-radius:50%;flex:none}
.ptop .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptm{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--gold);min-width:2ch;text-align:right}
.pbody{flex:1;display:flex;flex-direction:column;gap:1em;padding:1em;overflow:auto;min-height:0}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.8em}
.center h2{margin:0;font-family:var(--serif);font-size:2rem}
.bigemoji{font-size:7rem;line-height:1}
.opts{display:grid;gap:.7em}
.opts .btn{font-size:1.3rem;padding:1em;flex-direction:column;gap:.1em}
.opts .btn small{font-size:.8rem;color:var(--muted);font-weight:600}
.kopts{display:grid;grid-template-columns:1fr 1fr;gap:.8em;flex:1}
.ktile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2em;border-radius:1.2em;background:var(--paper);color:#2a1d02;font-weight:800;font-size:1rem;border:4px solid transparent;min-height:8rem;padding:.4em;text-align:center}
.ktile span{font-size:4.2rem;line-height:1.1}
.ktile.no{opacity:.25;filter:grayscale(1)}
.ktile.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.judge{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:4px solid var(--gold);padding:1em 1em calc(1em + env(safe-area-inset-bottom));text-align:center;z-index:5;animation:up .2s}
.judge h3{margin:0 0 .2em;font-size:1.4rem}
.judge .row{display:flex;gap:.8em;margin-top:.6em}
.judge .row .btn{flex:1;font-size:1.3rem;padding:.7em}
@keyframes up{from{transform:translateY(100%)}}
.buzz{width:min(70vw,18rem);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#e5484d 55%,#a91d22);color:#fff;font-family:var(--display);font-weight:800;font-size:3.4rem;box-shadow:0 1.1rem 0 #7a1216,0 1.4rem 2rem rgba(0,0,0,.5)}
.buzz:active{transform:translateY(.8rem);box-shadow:0 .3rem 0 #7a1216}
.buzz:disabled{filter:grayscale(1);opacity:.4}
.hintbox{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:.15em;text-align:center;white-space:pre-wrap}
.mine{display:flex;flex-wrap:wrap;gap:.4em;justify-content:center}
.toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-weight:800;font-size:1.3rem;padding:.6em 1.2em;border-radius:99px;z-index:30;animation:pop .2s;max-width:90vw;text-align:center}
.check{display:flex;gap:.7em;align-items:center;padding:.9em 1em;border-radius:12px;background:var(--bg2);border:2px solid var(--line);font-weight:700;text-align:left}
.check input{width:1.6em;height:1.6em;flex:none}
.home{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:1rem;padding:1.5rem;max-width:30rem;margin:0 auto}
.home h1{font-family:var(--serif);font-style:italic;font-size:3rem;margin:0;color:var(--gold)}
.home h1 span{color:var(--fg)}
.home p{margin:0;line-height:1.4}

/* the phone piano (always shown sideways; rotated for the player if the phone is upright) */
.pv{position:fixed;inset:0;display:flex;flex-direction:column;background:#0d0b1c;z-index:2}
.pvtop{display:flex;align-items:center;gap:.45em;padding:.35em .6em;flex:none;background:var(--bg2);border-bottom:2px solid var(--line);font-size:.95rem}
.pvtop .song{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.pvtop .song b{color:var(--gold);font-family:var(--serif);font-size:1.15em}
.pvtop .btn{padding:.35em .6em;font-size:.85rem;border-radius:10px}
.lane{flex:none;height:3.1rem;display:flex;align-items:center;gap:4px;padding:0 .6em;overflow:hidden;position:relative;background:#16122b}
.lane .n{flex:none;height:2.3rem;border-radius:.5rem;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.3rem;color:#fff;opacity:.55;min-width:1.4rem}
.lane .n.now{opacity:1;outline:3px solid #fff;transform:scale(1.06)}
.lane .msg{color:var(--muted);font-weight:700;padding:0 .3em}
.lane .done{color:var(--good);font-weight:800}
.kb{flex:1;position:relative;display:flex;padding:0 .3em .3em;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none}
.wk{flex:1;position:relative;margin:0 1px;background:linear-gradient(180deg,#f4f1ea,#fff 30%);border-radius:0 0 .5rem .5rem;box-shadow:inset 0 -.4rem 0 #d8d3c6;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.6rem;font-family:var(--display);font-weight:800;font-size:1.25rem;touch-action:none}
.bk{position:absolute;top:0;height:58%;width:calc(100% / 15 * .62);background:linear-gradient(180deg,#2c2c34,#111 85%);border-radius:0 0 .35rem .35rem;z-index:2;box-shadow:inset 0 -.3rem 0 #000,0 .2rem .3rem rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding-bottom:.35rem;font-family:var(--display);font-weight:800;font-size:.8rem;color:#ddd;touch-action:none}
.wk.down{background:#d9d3c4;box-shadow:inset 0 -.15rem 0 #bdb6a6}
.bk.down{background:#444}
.wk.next,.bk.next{box-shadow:inset 0 0 0 .3rem var(--pc),inset 0 -2.6rem 1.4rem -1rem var(--pc)}
.bk.next{background:linear-gradient(180deg,#2c2c34,var(--pc))}
.wk.next2{box-shadow:inset 0 0 0 .2rem color-mix(in srgb,var(--pc) 45%,transparent)}
.wk.oops,.bk.oops{background:#ffb3b3}
.kb .lbl{pointer-events:none}
.kb.nolabels .lbl{display:none}
.pvov{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.4em;background:rgba(13,11,28,.88);text-align:center;padding:1em}
.pvov h2{margin:0;font-family:var(--serif);font-size:2rem}

/* Christmas look */
.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.snow i{position:absolute;top:-2vh;border-radius:50%;background:#fff;opacity:.75;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),105vh)}}
.tvwrap,.pw,.home{z-index:1}
.home{position:relative}
body.tv.xmas{background:radial-gradient(40vw 60vh at 50% -10%,rgba(255,220,150,.2),transparent 70%),
  radial-gradient(30vw 30vh at 100% 100%,rgba(30,110,60,.35),transparent 70%),radial-gradient(30vw 30vh at 0 100%,rgba(180,20,40,.3),transparent 70%),var(--wall)}
</style>
</head>

<script>
// ===================================================================
// Tap That Tune — your phone becomes a piano, the tune plays on the TV,
// everyone else guesses the song. Same set-up as Buzz In and Doodle Gallery:
// the TV runs the game, phones scan to join, live sync over Supabase Realtime.
// Add &local=1 to test with several tabs on one computer.
//
// Songs: the built-in tunes are all out of copyright (traditional, nursery
// rhymes, carols, classical). "From memory" songs store only the title;
// the pianist works the tune out by ear, so no melody is kept in the app.
// ===================================================================
const SUPA_URL = "https://uqwlmegbelyqtbegxqlz.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxd2xtZWdiZWx5cXRiZWd4cWx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NTYzNzAsImV4cCI6MjEwNzMzMjM3MH0.bSeF8_kwKqSrEj3n8Ku2OeSU8E5nMqJj0hcfgXb8cW0";

const P = new URLSearchParams(location.search);
const LOCAL = P.has("local");
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const COLORS = ["#ff6b6b", "#4dabff", "#ffd43b", "#51e08a", "#c792ff", "#ff9f43", "#3ee6d6", "#ff7ac0", "#b5e853", "#a5b4cc", "#ffb4a2", "#8ce99a"];
const now = () => Date.now();
const uid = () => Math.random().toString(36).slice(2, 10);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
const code4 = () => Array.from({ length: 4 }, () => "BCDFGHJKLMNPQRSTVWXZ"[Math.random() * 20 | 0]).join("");
const buzzPhone = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { } };
const ord = n => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");

// ===== Notes and the keyboard (two octaves, C4 to C6) =====
const KB_LO = 60, KB_HI = 84;
const NB = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const NAMES = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
const isBlack = m => [1, 3, 6, 8, 10].includes(m % 12);
const WHITES = []; for (let m = KB_LO; m <= KB_HI; m++) if (!isBlack(m)) WHITES.push(m);
const octCol = m => m >= 84 ? "#b06cff" : m >= 72 ? "#e8742c" : "#2f6fd6"; // letter colour per octave so the two Cs look different
function parseNotes(str) {
  const out = str.trim().split(/\s+/).map(tok => {
    const [n, b] = tok.split(":");
    if (n === "R") return { m: 0, b: +b };
    const x = n.match(/^([A-G])(#|b)?(\d)$/);
    return { m: 12 * (+x[3] + 1) + NB[x[1]] + (x[2] === "#" ? 1 : x[2] === "b" ? -1 : 0), b: +b };
  });
  const ms = out.filter(o => o.m).map(o => o.m); let sh = 0;
  while (Math.min(...ms) + sh < KB_LO) sh += 12;
  while (Math.max(...ms) + sh > KB_HI) sh -= 12;
  return out.map(o => o.m ? { m: o.m + sh, b: o.b } : o);
}

// ===== Answer checking =====
const words = s => " " + String(s || "").toLowerCase().normalize("NFD").replace(/\p{M}/gu, "").replace(/'/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\b(a|an|the|oh|o|its|it|theme|song|tune)\b/g, " ").replace(/\s+/g, " ").trim() + " ";
const norm = s => words(s).replace(/ /g, "");
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function check1(guess, ans) {
  const a = norm(guess), b = norm(ans);
  if (!a || !b) return "no";
  if (a === b) return "yes";
  const wa = words(guess), wb = words(ans).trim();
  if ((wb.includes(" ") || wb.length >= 8) && wa.includes(" " + wb + " ") && a.length <= b.length + 14) return "yes";
  const d = lev(a, b);
  if (b.length >= 5 && d <= 1) return "yes";
  if (b.length >= 9 && d <= 2) return "yes";
  if (b.length >= 15 && d <= 3) return "yes";
  if (d <= 2 || (b.length >= 6 && d <= 4)) return "close";
  return "no";
}
function checkSong(guess, s) {
  const all = [s.t, s.t.replace(/\s*\(.*\)\s*/g, " ").trim()].concat(s.a || []);
  let close = false;
  for (const x of all) { const r = check1(guess, x); if (r === "yes") return "yes"; if (r === "close") close = true; }
  return close ? "close" : "no";
}

    const oscs = [["triangle", 1, .55], ["sine", 2, .22], ["sine", 3, .07], ["square", 1, .025]].map(([type, mul, lvl]) => { const o = c.createOscillator(), og = c.createGain(); o.type = type; o.frequency.value = f * mul; og.gain.value = lvl; o.connect(og); og.connect(g); o.start(t); o.stop(t + 3); return o; });

    return { stop(at) { const s = Math.max(c.currentTime, at || 0); try { g.gain.cancelScheduledValues(s); g.gain.setValueAtTime(g.gain.value || v * .3, s); g.gain.exponentialRampToValueAtTime(.0008, s + .22); oscs.forEach(o => o.stop(s + .25)); } catch (e) { } } };
  },
};

// ===== Transport (same as Buzz In) =====
async function connect(room, onMsg, onStatus) {
  if (LOCAL) {
    const bc = new BroadcastChannel("piano-" + room);
    bc.onmessage = e => onMsg(e.data);
    onStatus && onStatus("ok");
    return { send: m => bc.postMessage(m) };
  }
  const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, { realtime: { params: { eventsPerSecond: 40 } } });
  const ch = sb.channel("piano-" + room, { config: { broadcast: { self: false } } });
  ch.on("broadcast", { event: "m" }, ({ payload }) => onMsg(payload));
  await new Promise((res, rej) => {
    let done = false;
    ch.subscribe(st => {
      if (st === "SUBSCRIBED") { onStatus && onStatus("ok"); if (!done) { done = true; res(); } }
      else if (st === "CHANNEL_ERROR" || st === "TIMED_OUT" || st === "CLOSED") { onStatus && onStatus("lost"); if (!done) { done = true; rej(new Error(st)); } }
    });
  });
  return { send: m => ch.send({ type: "broadcast", event: "m", payload: m }) };
}

// ===== Christmas look: falling snow =====
function festive(on, n) {
  document.body.classList.toggle("xmas", on);
  let sn = document.querySelector(".snow");
  if (!on) { if (sn) sn.remove(); return; }
  if (sn) return;
  sn = document.createElement("div"); sn.className = "snow";
  for (let i = 0; i < n; i++) {
    const z = 3 + Math.random() * 7, el = document.createElement("i");
    el.style.cssText = `left:${Math.random() * 100}vw;width:${z}px;height:${z}px;--dx:${(Math.random() - .5) * 12}vw;animation-duration:${8 + Math.random() * 10}s;animation-delay:-${Math.random() * 18}s;opacity:${.35 + Math.random() * .5}`;
    sn.appendChild(el);
  }
  document.body.prepend(sn);
}

// ======================================================================
// TV — runs the game and plays the sound
// ======================================================================
async function tvMain() {
  document.body.className = "tv";
  const room = (P.get("tv") || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4) || code4();
  history.replaceState(null, "", "?tv=" + room + (LOCAL ? "&local=1" : ""));
  const joinUrl = location.origin + location.pathname + "?join=" + room + (LOCAL ? "&local=1" : "");
  const S = {
    phase: "lobby", players: {}, order: [], settings: Object.assign({ songs: "lib", guide: "lights", guess: "type", who: "all", laps: 1, time: 90, edition: new Date().getMonth() === 11 ? "xmas" : "std" }, ls.get("piano_settings", {})),
    queue: [], turnNo: 0, totalTurns: 0, turn: null, concert: [], feed: [], revealUntil: 0,
  };
  let conn = "Connecting…", link = null, colorI = 0, lastKey = "";
  // sound + key lights: notes are scheduled a moment after they arrive so the rhythm survives the internet
  const BUF = 170; let clockOff = null; const vis = []; const held = new Map(); let replaying = null;
  if (LOCAL) window.__S = S;

  const send = m => link && link.send(m);
  const alive = p => now() - p.seen < 20000;
  const plays = p => S.settings.who === "kids" ? p.kid : true;
  const eligible = () => S.order.map(id => S.players[id]).filter(p => p && plays(p));
  const hostId = () => (S.order.map(id => S.players[id]).find(p => p && alive(p)) || {}).id || null;

  function pub() {
    const t = S.turn;
    const left = t ? (t.paused != null ? t.paused : Math.max(0, t.endsAt - now())) : 0;
    return {
      phase: S.phase, settings: S.settings, host: hostId(), turnNo: S.turnNo, total: S.totalTurns,
      players: S.order.map(id => S.players[id]).filter(Boolean).map(p => ({ id: p.id, name: p.name, kid: p.kid, color: p.color, score: p.score })),
      drawer: t && t.drawer, left, paused: !!(t && t.paused != null), dur: t ? t.dur : 0,
      hint: t && t.song && S.settings.guess === "type" ? hint(t) : null,
      got: t ? t.got : {}, buzz: t && t.buzz, wrong: t ? Object.keys(t.wrong) : [],
      kc: t && t.kc ? t.kc.map(s => ({ t: s.t, e: s.e })) : null,
      reveal: S.phase === "reveal" && t ? { t: t.song && t.song.t, e: t.song && t.song.e, skipped: !!t.skipped, dpts: t.dpts } : null,
    };
  }
  let pushT = null;
  const needSecret = new Set();
  function push() { clearTimeout(pushT); pushT = setTimeout(() => { send({ t: "state", st: pub() }); needSecret.forEach(id => secret(S.players[id])); needSecret.clear(); render(); }, 40); }
  function secret(p) {
    const t = S.turn; if (!t || !p || t.drawer !== p.id) return;
    if (S.phase === "choose") send({ t: "secret", to: p.id, opts: t.opts.map(s => ({ t: s.t, e: s.e, mem: !!s.mem })) });
    if (S.phase === "play" || S.phase === "reveal") send({ t: "secret", to: p.id, song: { t: t.song.t, e: t.song.e, mem: !!t.song.mem, n: t.song.n || null, bpm: t.song.bpm || 0 } });
  }
  function hint(t) {
    const w = t.song.t, frac = 1 - Math.max(0, (t.paused != null ? t.paused : t.endsAt - now())) / t.dur;
    const letters = [...w].map((c, i) => /[a-z0-9]/i.test(c) ? i : -1).filter(i => i >= 0);
    const show = Math.round(letters.length * (frac > .75 ? .3 : frac > .5 ? .15 : 0));
    const keep = new Set(t.hintOrder.slice(0, show));
    return [...w].map((c, i) => c === " " ? "   " : !/[a-z0-9]/i.test(c) ? c : keep.has(i) ? c.toUpperCase() : "_").join(" ").replace(/ {4,}/g, "   ");
  }

  // ---- game flow ----
  function start() {
    const el = eligible();
    if (el.length < 2) return;
    ls.set("piano_settings", S.settings);
    S.order.forEach(id => S.players[id] && (S.players[id].score = 0));
    S.concert = []; S.feed = []; S.turnNo = 0;
    S.queue = []; for (let i = 0; i < S.settings.laps; i++) S.queue.push(...el.map(p => p.id));
    S.totalTurns = S.queue.length;
    nextTurn();
  }
  function playAgain() { if (eligible().length >= 2) start(); else toLobby(); }
  function toLobby() { S.phase = "lobby"; S.turn = null; push(); }
  function pools(kid) {
    const xm = S.settings.edition === "xmas";
    let lib = SONGS.filter(s => xm ? s.x : true), mem = MEMORY.filter(s => xm ? s.x : !s.x);
    if (kid) lib = lib.filter(s => s.k);
    return { lib, mem };
  }
  function nextTurn() {
    let id; while ((id = S.queue.shift())) { const p = S.players[id]; if (p && alive(p) && plays(p)) break; }
    if (!id) { S.phase = "end"; S.turn = null; push(); return; }
    const p = S.players[id];
    S.turnNo++;
    const used = new Set(S.concert.map(g => g.t)), { lib, mem } = pools(p.kid);
    const fresh = a => { const f = a.filter(s => !used.has(s.t)); return f.length >= 3 ? f : a; };
    const mode = p.kid ? "lib" : S.settings.songs;
    let opts;
    if (mode === "lib") opts = shuffle(fresh(lib)).slice(0, 3);
    else if (mode === "mem") opts = shuffle(fresh(mem)).slice(0, 3);
    else { const a = shuffle(fresh(lib)), b = shuffle(fresh(mem)); opts = shuffle(Math.random() < .5 ? [a[0], a[1], b[0]] : [a[0], b[0], b[1]]); }
    S.turn = { drawer: id, opts, song: null, got: {}, wrong: {}, kidWrong: {}, buzz: null, paused: null, dpts: 0, chooseEnds: now() + 20000, rec: [], recStart: 0 };
    clockOff = null; held.clear();
    S.phase = "choose"; S.feed = [];
    needSecret.add(id); push();
  }
  function choose(i) {
    const t = S.turn; if (S.phase !== "choose" || !t.opts[i]) return;
    t.song = t.opts[i];
    const p = S.players[t.drawer];
    t.dur = (S.settings.time + (p && p.kid ? 20 : 0)) * 1000; t.endsAt = now() + t.dur;

  function drawerBonus(n) { const t = S.turn, d = S.players[t.drawer]; if (d) { d.score += n; t.dpts += n; } }

    const d = S.players[t.drawer];

    let shift = 0; for (let i = 1; i < t.rec.length; i++) { const gap = t.rec[i][1] - shift - t.rec[i - 1][1]; if (gap > 2000) shift += gap - 1200; t.rec[i][1] -= shift; }
    if (t.song && !skipped && t.rec.length) S.concert.push({ t: t.song.t, e: t.song.e, by: d ? d.name : "", color: d ? d.color : "#fff", rec: t.rec.slice(0, 600) });
    if (t.song && !skipped) { const n = Object.keys(t.got).length; if (!n) feedAdd("Nobody got it this time"); }
    S.phase = "reveal";
    let len = 0;
    // play the real tune at the reveal (built-in songs only; "from memory" songs aren't stored)
    if (t.song && t.song.n && !skipped) len = playSeq(parseNotes(t.song.n), t.song.bpm, "#f2c94c", 600);
    S.revealUntil = now() + (skipped ? 3500 : Math.min(14000, Math.max(7000, len + 2200)));
    push();
  }
  function feedAdd(html, ok) { if (!html) return; S.feed.push({ html, ok }); if (S.feed.length > 7) S.feed.shift(); }

  function onGuess(p, text) {
    const t = S.turn; if (S.phase !== "play" || !t || t.drawer === p.id || !plays(p) || t.got[p.id] != null || p.kid) return;
    if (S.settings.guess !== "type") return;
    const r = checkSong(text, t.song);
    if (r === "yes") { const n = pts(t); award(p, n); drawerBonus(20); feedAdd(`${esc(p.name)} got it! +${n}`, true); push(); maybeAllGot(); }
    else if (r === "close") { send({ t: "close", to: p.id }); }
    else { feedAdd(`<b>${esc(p.name)}:</b> ${esc(String(text).slice(0, 30))}`); render(); }
  }
  function onKidPick(p, i) {
    const t = S.turn; if (S.phase !== "play" || !t || !t.kc || t.drawer === p.id || !plays(p) || t.got[p.id] != null || t.buzz) return;
    const c = t.kc[i]; if (!c) return;
    if (c.t === t.song.t) {
      const n = Math.max(20, pts(t) - 15 * (t.kidWrong[p.id] || 0));
      award(p, n); drawerBonus(S.settings.guess === "buzz" ? 40 : 20);
      feedAdd(`${esc(p.name)} got it! +${n}`, true); push();
      if (S.settings.guess === "buzz") endTurn(); else maybeAllGot();
    } else { t.kidWrong[p.id] = (t.kidWrong[p.id] || 0) + 1; send({ t: "nope", to: p.id, i }); }
  }
  function onBuzz(p) {
    const t = S.turn; if (S.phase !== "play" || !t || t.buzz || t.drawer === p.id || !plays(p) || p.kid || t.wrong[p.id] || S.settings.guess !== "buzz") return;
    t.buzz = p.id; t.paused = Math.max(0, t.endsAt - now()); t.buzzAt = now();

  }
  function judge(ok) {
    const t = S.turn; if (S.phase !== "play" || !t || !t.buzz) return;
    const p = S.players[t.buzz];
    if (ok && p) { const n = pts(t); award(p, n); drawerBonus(40); feedAdd(`${esc(p.name)} got it! +${n}`, true); t.buzz = null; endTurn(); return; }
    if (p) { t.wrong[p.id] = 1; feedAdd(`${esc(p.name)} buzzed… not quite!`); }

  }

  // ---- sound on the TV ----
  const audioAt = tvMs => Synth.ctx ? Synth.ctx.currentTime + Math.max(0, tvMs - now()) / 1000 : 0;
  function keyDown(m) { // a key pressed on the pianist's phone
    const t = S.turn, d = t && S.players[t.drawer]; if (!d) return;
    const arrive = now(), at = +m.at || arrive, n = Math.round(+m.n);
    if (!(n >= KB_LO && n <= KB_HI)) return;
    const off = arrive - at; if (clockOff == null || off < clockOff) clockOff = off;
    const play = Math.max(arrive, at + clockOff + BUF);
    const v = Synth.ok() ? Synth.note(n, audioAt(play), .5) : null;
    const e = { n, s: play, e: Infinity, c: d.color }; vis.push(e);
    held.set(m.k, { v, e });
    if (!t.recStart) t.recStart = play;
    if (t.rec.length < 600) { const r = [n, play - t.recStart, 400]; t.rec.push(r); held.get(m.k).r = r; }
  }
  function keyUp(m) {
    const h = held.get(m.k); if (!h) return; held.delete(m.k);

  function playSeq(notes, bpm, col, lead) { // play a tune (the real one at the reveal)
    const spb = 60000 / (bpm || 120); let t0 = now() + (lead || 300), t = t0;
    for (const o of notes) { const d = o.b * spb; if (o.m) { const dur = Math.max(140, d * .92); if (Synth.ok()) { const v = Synth.note(o.m, audioAt(t), .45); v && v.stop(audioAt(t + dur)); } vis.push({ n: o.m, s: t, e: t + dur, c: col }); } t += d; }

    switch (m.t) {
      case "hi": break;
      case "set": if (isHost && (S.phase === "lobby" || S.phase === "end") && SETS.some(x => x[0] === m.k && x[2].some(v => v[0] === m.v))) { S.settings[m.k] = m.v; push(); } break;
      case "start": if (isHost && S.phase === "lobby") start(); break;

    if (S.phase === "play" && t) {

  // ---- rendering ----
  function render() {
    const key = S.phase + "|" + S.turnNo;
    if (key !== lastKey) { lastKey = key; build(); }
    upd();
  }
  function header() {
    return `<header class="tvtop"><div class="logo" id="logo"></div><div class="tinfo" id="tinfo"></div><div class="codesm">Join code <b>${room}</b></div></header>`;
  }
  function build() {
    const main = S.phase === "lobby" ? `<main class="tvmain">
        <div class="stagecol"><div class="qrcard"><div id="qr"></div><div class="k">${Array.from({ length: 15 }, (_, i) => `<i></i>${[0, 1, 3, 4, 5, 7, 8, 10, 11, 12].includes(i) && i < 14 ? `<i class="b"></i>` : ""}`).join("")}</div></div>
          <div class="plaque"><small>Tonight's concert</small><b>Scan to join</b><div style="font-weight:700">or go to the link and enter <b style="font-family:var(--display);font-size:1.3em;letter-spacing:.1em">${room}</b></div></div></div>
        <div class="panel"><h3>Pianists</h3><div class="plist" id="plist"></div>
          <button class="btn gold big" id="start">Start the game</button><div class="lobbynote" id="snote"></div><div id="sets"></div><div class="lobbynote">${esc(conn)}</div></div></main>`
      : S.phase === "end" ? `<main class="end"><div class="concert" id="gal"></div>
        <div class="panel"><h3 id="exh"></h3><div class="lobbynote">Press ▶ to hear any performance again.</div><div class="plist podium" id="plist"></div>
          <div class="lobbynote" style="margin-top:.4em"><b style="color:var(--fg)">Next game</b> · change anything below, then play again. Same players, no need to rejoin.</div>
          <button class="btn gold big" id="again">▶ Play again</button><div class="lobbynote" id="snote"></div><div id="sets"></div>
          <button class="btn" id="tolobby">Back to the lobby (to add players)</button></div></main>`
      : `<main class="tvmain">
        <div class="stagecol"><div class="plaque" id="plaque"></div><canvas id="stage" width="1600" height="900"></canvas></div>
        <div class="panel"><div class="timer" id="timer"></div><div class="plist" id="plist"></div><div class="feed" id="feed"></div><button class="btn" id="skip" style="margin-top:auto">Skip this one</button></div></main>`;
    app.innerHTML = `<div class="tvwrap">${header()}${main}</div><div id="bov"></div><div id="sov"></div>`;
    if (S.phase === "lobby") { try { new QRCode($("#qr"), { text: joinUrl, width: 400, height: 400, correctLevel: QRCode.CorrectLevel.M }); } catch (e) { $("#qr").textContent = joinUrl; } }
    if (S.phase === "end") $("#gal").onclick = e => { const b = e.target.closest("[data-r]"); if (b) { Synth.init(); replay(+b.dataset.r); } };

      const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#1b1640"); g.addColorStop(1, "#0b0918"); x.fillStyle = g; x.fillRect(0, 0, W, H);

      x.globalAlpha = 1;
      // keys
      WHITES.forEach((m, i) => { const c = lit.get(m); x.fillStyle = c || "#f6f2ea"; x.fillRect(kx + i * ww + 2, ky, ww - 4, kh); if (c) { x.fillStyle = "rgba(255,255,255,.35)"; x.fillRect(kx + i * ww + 2, ky, ww - 4, kh * .3); } });
      for (let m = KB_LO; m <= KB_HI; m++) if (isBlack(m)) { const c = lit.get(m), cx = xOf(m), bw = ww * .6; x.fillStyle = c || "#16161c"; x.fillRect(cx - bw / 2, ky, bw, kh * .6); }

  render();

  function onMsg(m) {

        <button class="btn" id="snd">${phoneSound ? "🔊" : "🔈"}</button><button class="btn" id="dskip">Skip</button><span class="ptm" id="ptm"></span></div>
      <div class="lane" id="lane"></div>
      <div class="kb ${!s.mem && guide === "lights" ? "nolabels" : ""}" id="kb">${keys}</div>
      <div id="judge"></div></div>`;
    orient(); addEventListener("resize", orient);
    const kb = $("#kb"), down = new Map();
    const press = (el, e) => {
      e.preventDefault(); if (down.has(e.pointerId)) return;
      const m = +el.dataset.m, k = id.slice(0, 3) + (++pressN);
      try { el.setPointerCapture(e.pointerId); } catch (_) { }
      down.set(e.pointerId, { el, k, v: phoneSound && Synth.ok() ? Synth.note(m, 0, .35) : null });
      el.classList.add("down"); send({ t: "key", k, n: m, at: Date.now() }); buzzPhone(8);
      advance(m, el);
    };
    const release = e => { const d = down.get(e.pointerId); if (!d) return; down.delete(e.pointerId); d.el.classList.remove("down"); d.v && d.v.stop(); send({ t: "off", k: d.k, at: Date.now() }); };
    kb.querySelectorAll("[data-m]").forEach(el => { el.onpointerdown = e => press(el, e); el.onpointerup = el.onpointercancel = el.onlostpointercapture = release; });
    kb.oncontextmenu = e => e.preventDefault();
    const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
    on("#gd", () => { guide = guide === "lights" ? "letters" : "lights"; $("#gd").textContent = guide === "lights" ? "🔤 Letters" : "💡 Lights"; kb.classList.toggle("nolabels", guide === "lights"); paintGuide(); });
    on("#fromtop", () => { idx = 0; paintGuide(); });
    on("#snd", () => { phoneSound = !phoneSound; ls.set("piano_phonesound", phoneSound); if (phoneSound) Synth.init(); $("#snd").textContent = phoneSound ? "🔊" : "🔈"; toast(phoneSound ? "Sound on this phone too" : "Sound from the TV only"); });
    on("#dskip", () => { if (confirm("Skip this song? Nobody scores for it.")) send({ t: "skip" }); });
    judgeShown = false; paintGuide();
  }
  function advance(m, el) {
    if (!seq.length) return;
    const target = nextNote(); if (!target) return;
    if (m === target.m) {
      idx = seq.indexOf(target) + 1;
      if (!nextNote()) { loops++; idx = 0; const ln = $("#lane"); if (ln) { ln.innerHTML = `<span class="done">🎉 That's the whole tune! Play it again, it starts from the top.</span>`; } setTimeout(paintGuide, 1600); buzzPhone([30, 30, 30]); return; }
    } else if (guide === "lights") { el.classList.add("oops"); setTimeout(() => el.classList.remove("oops"), 220); }
    paintGuide();
  }
  const nextNote = () => { for (let i = idx; i < seq.length; i++) if (seq[i].m) return seq[i]; return null; };
  function paintGuide() {
    const kb = $("#kb"), ln = $("#lane"); if (!kb || !ln) return;
    kb.querySelectorAll(".next,.next2").forEach(e => e.classList.remove("next", "next2"));
    if (!seq.length) { ln.innerHTML = `<span class="msg">🧠 Play it from memory. The note names are on the keys to help. Hum it to yourself first!</span>`; return; }
    const ahead = []; for (let i = idx; i < seq.length && ahead.length < 14; i++) ahead.push(seq[i]);
    const notes = ahead.filter(o => o.m);
    if (guide === "lights") {
      if (notes[0]) { const a = kb.querySelector(`[data-m="${notes[0].m}"]`); a && a.classList.add("next"); }
      if (notes[1] && notes[1].m !== notes[0].m) { const b = kb.querySelector(`[data-m="${notes[1].m}"]`); b && b.classList.add("next2"); }
    }
    const unit = 1.9; let first = true;
    ln.innerHTML = ahead.map(o => {
      if (!o.m) return `<span style="flex:none;width:${o.b * unit * .6}rem"></span>`;
      const col = guide === "lights" ? (first ? "var(--pc)" : "#4a4170") : octCol(o.m);
      const html = `<span class="n ${first ? "now" : ""}" style="width:${Math.max(1.5, o.b * unit)}rem;background:${col}">${guide === "letters" ? NAMES[o.m % 12] : ""}</span>`;
      first = false; return html;
    }).join("");
  }

  function upd(r) {
    festive(!!(ST && ST.settings.edition === "xmas") && r !== "play", 22);
    const tm = $("#ptm");
    if (tm) { const s = ST && ST.phase === "play" ? Math.ceil(Math.max(0, ST.paused ? ST.left : localEnd - Date.now()) / 1000) : null; tm.textContent = s == null ? "" : (ST.paused ? "⏸" : "") + s; }
    if ((r === "lobby" || r === "end") && $("#sets")) {
      $("#sets").innerHTML = setsHTML(ST.settings);
      const n = ST.players.filter(p => ST.settings.who === "kids" ? p.kid : true).length;
      if ($("#start")) $("#start").disabled = n < 2;
      $("#snote").textContent = n < 2 ? (r === "end" ? "Not enough players for these settings yet. Play again will open the lobby." : "Waiting for more players…") : `${n} pianists ready`;
    }
    if (r === "type") { const h = $("#hint"); if (h) h.textContent = ST.hint || ""; const m = $("#mine"); if (m) m.innerHTML = myGuesses.slice(-6).map(g => `<span class="chip">${esc(g)}</span>`).join(""); }
    if (r === "buzz") {
      const b = $("#bz"), s = $("#bzs"); if (!b) return;
      const wrong = ST.wrong.includes(id), other = ST.buzz && ST.buzz !== id, minebz = ST.buzz === id;
      b.disabled = wrong || !!ST.buzz;
      const bn = other ? (ST.players.find(x => x.id === ST.buzz) || {}).name : "";
      s.textContent = minebz ? "You buzzed! Say the song out loud." : wrong ? "Not quite. Wait for the next song." : other ? `${bn} buzzed…` : "Know the song? Buzz, then say it out loud.";
    }
    if (r === "play") {
      const j = $("#judge"); if (!j) return;
      if (ST.buzz) {
        if (!judgeShown) {
          judgeShown = true; const b = ST.players.find(x => x.id === ST.buzz) || {};
          j.innerHTML = `<div class="judge"><h3>🔔 ${esc(b.name)} buzzed!</h3><div class="muted">Did they say <b>${esc(secretSong ? secretSong.t : "it")}</b>?</div><div class="row"><button class="btn good" data-j="1">✓ Yes</button><button class="btn bad" data-j="0">✗ No</button></div></div>`;
          j.onclick = e => { const b2 = e.target.closest("[data-j]"); if (b2) send({ t: "judge", ok: b2.dataset.j === "1" }); };
        }
      } else if (judgeShown) { judgeShown = false; j.innerHTML = ""; }
    }
  }
  setInterval(() => { if (ST && ST.phase === "play") { const t = $("#ptm"); if (t) upd(role()); } }, 250);

  // ---- start ----
  if (!me) joinForm(); else render();
  try { link = await connect(room, onMsg); } catch (e) { app.innerHTML = `<div class="home"><h2>Couldn't connect</h2><p class="muted">Check your internet and try again.</p><button class="btn gold" onclick="location.reload()">Try again</button></div>`; return; }
  if (me) send({ t: "join", name: me.name, kid: me.kid });
  setInterval(() => {
    if (!me) return;
    if (Date.now() - lastState > 8000) send({ t: "join", name: me.name, kid: me.kid });
    else send({ t: "hi" });
  }, 3000);
  try { if (navigator.wakeLock) { let wl = await navigator.wakeLock.request("screen"); document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible") try { wl = await navigator.wakeLock.request("screen"); } catch (e) { } }); } } catch (e) { }
}
</script>
</body>
</html>
