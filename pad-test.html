<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090b14">
<title>Buzz In – Controller Test</title>
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#090b14; --bg2:#10142a; --panel:#141936; --line:#262d55; --fg:#f3f5ff; --muted:#9097c0;
  --gold:#ffc93c; --gold-ink:#1b1300; --good:#33d17a; --warn:#ffb020; --bad:#ff5d5d;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:var(--fg);background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:.8em .9em;width:100%;min-width:0}
.disp{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;border-radius:14px;padding:.8em 1.2em;font-weight:700;font-size:1rem;background:var(--panel);border:2px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.big{font-size:1.2rem;padding:1em 1.2em;width:100%}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.45em .8em;border-radius:99px;border:2px solid var(--line);background:var(--bg2);font-weight:700;font-size:.9rem}
.chip.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}

/* landing */
.home{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:1rem;padding:1.5rem;max-width:30rem;margin:0 auto}
.home h1{font-size:3rem;margin:0;color:var(--gold)}
.home p{margin:0 0 .5rem;line-height:1.4}

/* TV */
body.tv{overflow:hidden;font-size:clamp(13px,1.1vw,22px)}
.tvwrap{position:fixed;inset:0;display:flex}
.stage{flex:1;position:relative;min-width:0}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.side{width:min(22em,36vw);background:var(--bg2);border-left:2px solid var(--line);padding:1.2em;display:flex;flex-direction:column;gap:1em;overflow:auto}
.side h2{margin:0;font-size:2em;color:var(--gold)}
.joinbox{display:flex;gap:1em;align-items:center}
.qr{background:#fff;padding:.5em;border-radius:.6em;line-height:0}
.qr img,.qr canvas{width:7em!important;height:7em!important}
.code{font-family:var(--display);font-weight:800;font-size:3.2em;letter-spacing:.08em;line-height:1}
.routes{display:flex;gap:.5em;flex-wrap:wrap}
.plist{display:flex;flex-direction:column;gap:.5em}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:.2em .6em;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:.8em;padding:.5em .7em}
.prow .dot{width:1em;height:1em;border-radius:50%}
.prow b{font-size:1.1em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .score{font-family:var(--display);font-weight:800;font-size:1.6em;color:var(--gold)}
.prow .meta{grid-column:1/-1;font-size:.85em;color:var(--muted);display:flex;gap:.8em;flex-wrap:wrap}
.ping{font-weight:800}
.p-good{color:var(--good)} .p-warn{color:var(--warn)} .p-bad{color:var(--bad)}
.note{font-size:.85em;color:var(--muted);line-height:1.4}
.conn{font-size:.8em;color:var(--muted)}

/* Phone */
body.pad{overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
.padwrap{position:fixed;inset:0;display:grid;grid-template-rows:auto auto 1fr auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.ptop{display:flex;align-items:center;gap:.6em;padding:.7em 1em;background:var(--bg2);border-bottom:2px solid var(--line)}
.ptop .dot{width:1.1em;height:1.1em;border-radius:50%;flex:none}
.ptop b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:.85rem;font-weight:800;padding:.3em .7em;border-radius:99px;background:var(--panel);border:2px solid var(--line);white-space:nowrap}
.tabs{display:flex;gap:.4em;padding:.6em 1em;overflow-x:auto}
.area{position:relative;margin:0 1em;border-radius:1.2em;background:var(--panel);border:2px dashed var(--line);overflow:hidden;touch-action:none}
.area .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:1.5em;color:var(--muted);pointer-events:none;line-height:1.4}
.knob,.base{position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
.base{width:140px;height:140px;border:3px solid var(--line);background:rgba(255,255,255,.04)}
.knob{width:64px;height:64px;background:var(--gold);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.pbottom{display:flex;gap:.8em;padding:1em;align-items:center}
.abtn{flex:1;height:5.5rem;border-radius:1.4em;background:var(--gold);color:var(--gold-ink);font-family:var(--display);font-weight:800;font-size:2rem;box-shadow:0 6px 0 #b8860b;touch-action:none}
.abtn.down{transform:translateY(5px);box-shadow:0 1px 0 #b8860b}
.small{display:flex;flex-direction:column;gap:.5em}
.small .btn{padding:.55em .8em;font-size:.9rem}
.flash{animation:fl .25s}
@keyframes fl{from{box-shadow:inset 0 0 0 6px var(--gold)}to{box-shadow:inset 0 0 0 0 transparent}}
@media (orientation:landscape) and (max-height:600px){
  .padwrap{grid-template-columns:1fr 13rem;grid-template-rows:auto auto 1fr}
  .ptop,.tabs{grid-column:1/-1}
  .area{margin:0 0 1em 1em}
  .pbottom{flex-direction:column;justify-content:center;padding:0 1em 1em}
  .abtn{width:100%;flex:none;height:9rem}
  .small{flex-direction:row}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// Buzz In controller test: phones as joystick / air pointer / touchpad, TV shows the result.
// Compares the cloud relay (Supabase Realtime, same as Buzz In) with a direct phone-to-screen link (WebRTC).
const SUPA_URL = "https://uqwlmegbelyqtbegxqlz.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxd2xtZWdiZWx5cXRiZWd4cWx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NTYzNzAsImV4cCI6MjEwNzMzMjM3MH0.bSeF8_kwKqSrEj3n8Ku2OeSU8E5nMqJj0hcfgXb8cW0";
const ICE = [{ urls: "stun:stun.l.google.com:19302" }];
const CLOUD_GAP = 66; // ms between input messages over the cloud (~15 a second)

const P = new URLSearchParams(location.search);
const LOCAL = P.has("local");
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const COLORS = ["#ff6b6b", "#4dabff", "#ffd43b", "#51e08a", "#c792ff", "#ff9f43", "#3ee6d6", "#ff7ac0"];
const uid = () => Math.random().toString(36).slice(2, 10);
const now = () => performance.now();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
const code4 = () => Array.from({ length: 4 }, () => "BCDFGHJKLMNPQRSTVWXZ"[Math.random() * 20 | 0]).join("");
const MODES = { joy: "🕹️ Joystick", air: "📡 Air pointer", pad: "👆 Touchpad" };

// ===== Transport =====
let sb = null;
async function chan(name, onMsg) {
  if (LOCAL) {
    const bc = new BroadcastChannel(name);
    bc.onmessage = e => onMsg(e.data);
    return { send: m => bc.postMessage(m), close: () => bc.close() };
  }
  if (!sb) sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, { realtime: { params: { eventsPerSecond: 40 } } });
  const ch = sb.channel(name, { config: { broadcast: { self: false } } });
  ch.on("broadcast", { event: "m" }, ({ payload }) => onMsg(payload));
  await new Promise((res, rej) => {
    let done = false;
    const t = setTimeout(() => { if (!done) { done = true; rej(new Error("timed out")); } }, 12000);
    ch.subscribe(st => {
      if (done) return;
      if (st === "SUBSCRIBED") { done = true; clearTimeout(t); res(); }
      else if (st === "CHANNEL_ERROR" || st === "TIMED_OUT" || st === "CLOSED") { done = true; clearTimeout(t); rej(new Error(st)); }
    });
  });
  return { send: m => ch.send({ type: "broadcast", event: "m", payload: m }), close: () => sb.removeChannel(ch) };
}
function iceDone(pc) {
  return new Promise(res => {
    if (pc.iceGatheringState === "complete") return res();
    const t = setTimeout(res, 2500);
    pc.addEventListener("icegatheringstatechange", () => { if (pc.iceGatheringState === "complete") { clearTimeout(t); res(); } });
  });
}
const pingClass = ms => ms == null ? "" : ms < 60 ? "p-good" : ms < 150 ? "p-warn" : "p-bad";

// ===== Router =====
if (P.has("tv")) tvMain();
else if (P.has("join")) padMain(P.get("join"));
else home();

function home() {
  const phone = matchMedia("(pointer:coarse)").matches && Math.min(innerWidth, innerHeight) < 700;
  app.innerHTML = `<div class="home">
    <h1 class="disp">Controller test</h1>
    <p class="muted">Try phones as joysticks and pointers on the big screen, and see how much delay there is.</p>
    <button class="btn big ${phone ? "" : "gold"}" id="tvb">📺 This is the TV screen</button>
    <p class="muted" style="font-size:.9rem">Open on the laptop you cast from, or one plugged into the TV.</p>
    <div style="display:flex;gap:.6em"><input id="code" maxlength="4" placeholder="Code" autocapitalize="characters" style="text-transform:uppercase;font-size:1.3rem;letter-spacing:.15em">
    <button class="btn ${phone ? "gold" : ""}" id="jb" style="flex:none">Join</button></div>
  </div>`;
  $("#tvb").onclick = () => { location.search = "?tv" + (LOCAL ? "&local=1" : ""); };
  const go = () => { const c = $("#code").value.trim().toUpperCase(); if (c.length === 4) location.search = "?join=" + c + (LOCAL ? "&local=1" : ""); };
  $("#jb").onclick = go;
  $("#code").onkeydown = e => { if (e.key === "Enter") go(); };
}

// ======================================================================
// TV
// ======================================================================
async function tvMain() {
  document.body.className = "tv";
  const room = (P.get("tv") || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4) || code4();
  history.replaceState(null, "", "?tv=" + room + (LOCAL ? "&local=1" : ""));
  const joinUrl = location.origin + location.pathname + "?join=" + room + (LOCAL ? "&local=1" : "");
  const players = {};
  let route = "cloud", conn = "Connecting…", colorI = 0;
  const stars = [], fx = [];

  app.innerHTML = `<div class="tvwrap">
    <div class="stage"><canvas id="cv"></canvas></div>
    <aside class="side">
      <h2 class="disp">Controller test</h2>
      <div class="joinbox"><div class="qr" id="qr"></div><div><div class="muted">Scan or go to the link and enter</div><div class="code">${room}</div></div></div>
      <div><div class="muted" style="margin-bottom:.4em">How phones talk to this screen</div>
        <div class="routes"><button class="chip" data-route="cloud">☁️ Cloud (as Buzz In)</button><button class="chip" data-route="direct">⚡ Direct (same Wi-Fi)</button></div></div>
      <div class="plist" id="plist"></div>
      <div class="note">Ping is the time for a message to go phone → screen → phone. Under 60 ms feels instant. Over 150 ms feels laggy for steering. Casting a tab adds its own video delay on top, which this number can't see. Compare how it feels cast versus on the laptop screen.</div>
      <div class="note">Collect the stars. Joystick: drive into them, A = dash. Pointers: aim and press A.</div>
      <div class="conn" id="conn"></div>
    </aside></div>`;
  try { new QRCode($("#qr"), { text: joinUrl, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M }); } catch (e) { }
  const cv = $("#cv"), ctx = cv.getContext("2d");
  let W = 1, H = 1, A = 1, DPR = 1;
  function size() { DPR = window.devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight; cv.width = W * DPR; cv.height = H * DPR; A = W / H; }
  addEventListener("resize", size); size();
  function setRouteUI() { document.querySelectorAll("[data-route]").forEach(b => b.classList.toggle("on", b.dataset.route === route)); }
  setRouteUI();
  document.querySelector(".routes").onclick = e => {
    const b = e.target.closest("[data-route]"); if (!b) return;
    route = b.dataset.route; setRouteUI();
    Object.values(players).forEach(p => p.ch && p.ch.send({ t: "route", route }));
  };

  for (let i = 0; i < 3; i++) stars.push(newStar());
  function newStar() { return { x: .1 * A + Math.random() * .8 * A, y: .12 + Math.random() * .76, born: now() }; }

  function sendTo(p, m, via) {
    if (via !== "cloud" && p.dc && p.dc.readyState === "open") { try { p.dc.send(JSON.stringify(m)); return; } catch (e) { } }
    p.ch && p.ch.send(m);
  }
  const buzz = (p, ms) => sendTo(p, { t: "buzz", ms });

  async function addPlayer(m) {
    let p = players[m.id];
    if (!p) {
      p = players[m.id] = { id: m.id, color: COLORS[colorI++ % COLORS.length], mode: "joy", x: .5 * A, y: .5, vx: 0, vy: 0, joy: { x: 0, y: 0 }, score: 0, rtt: null, via: "cloud", ins: 0, ips: 0, lastSeen: now(), dashAt: -9e9, trail: [], ch: null, pc: null, dc: null, pending: null, bumpAt: {} };
      p.pending = chan("pad-" + room + "-" + m.id, (msg) => onPad(p, msg, "cloud")).then(ch => { p.ch = ch; p.pending = null; }).catch(() => { delete players[m.id]; });
    }
    p.name = String(m.name || "Player").slice(0, 16);
    if (m.mode) p.mode = m.mode;
    p.lastSeen = now();
    if (p.pending) await p.pending;
    if (players[m.id]) p.ch.send({ t: "welcome", route, color: p.color });
    drawList();
  }
  function removePlayer(p) {
    try { p.pc && p.pc.close(); } catch (e) { }
    try { p.ch && p.ch.close(); } catch (e) { }
    delete players[p.id]; drawList();
  }
  function onPad(p, m, via) {
    p.lastSeen = now();
    switch (m.t) {
      case "in":
        p.ins++;
        if (m.k === "joy") { p.joy.x = clamp(+m.x || 0, -1, 1); p.joy.y = clamp(+m.y || 0, -1, 1); }
        else if (m.k === "ptr") { p.x = clamp(p.x + (+m.dx || 0) * A, 0, A); p.y = clamp(p.y + (+m.dy || 0) * A, 0, 1); }
        break;
      case "btn": if (m.down) press(p); break;
      case "mode": if (MODES[m.mode]) { p.mode = m.mode; p.vx = p.vy = 0; p.joy = { x: 0, y: 0 }; p.trail = []; } drawList(); break;
      case "centre": p.x = .5 * A; p.y = .5; p.trail = []; break;
      case "ping": p.rtt = m.rtt; p.via = via; sendTo(p, { t: "pong", s: m.s }, via); break;
      case "offer": answer(p, m.sdp); break;
      case "bye": removePlayer(p); break;
    }
  }
  async function answer(p, sdp) {
    try { p.pc && p.pc.close(); } catch (e) { }
    const pc = p.pc = new RTCPeerConnection({ iceServers: ICE });
    pc.ondatachannel = e => {
      const dc = e.channel; p.dc = dc;
      dc.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (_) { return; } onPad(p, m, "direct"); };
      dc.onclose = () => { if (p.dc === dc) p.dc = null; };
    };
    try {
      await pc.setRemoteDescription({ type: "offer", sdp });
      await pc.setLocalDescription(await pc.createAnswer());
      await iceDone(pc);
      if (p.pc === pc) p.ch.send({ t: "answer", sdp: pc.localDescription.sdp });
    } catch (e) { }
  }

  function press(p) {
    if (p.mode === "joy") {
      if (now() - p.dashAt > 900) { p.dashAt = now(); const l = Math.hypot(p.joy.x, p.joy.y) || 1; p.vx += p.joy.x / l * 1.1; p.vy += p.joy.y / l * 1.1; }
      return;
    }
    fx.push({ x: p.x, y: p.y, c: p.color, t: now(), r: .05 });
    for (const s of stars) if (Math.hypot(s.x - p.x, s.y - p.y) < .06) { collect(p, s); break; }
  }
  function collect(p, s) {
    p.score++; buzz(p, 40);
    fx.push({ x: s.x, y: s.y, c: "#ffc93c", t: now(), r: .09 });
    Object.assign(s, newStar());
    drawList();
  }

  // ----- game loop -----
  const R = .035;
  let last = now();
  function step() {
    const t = now(), dt = Math.min(.05, (t - last) / 1000); last = t;
    const list = Object.values(players);
    for (const p of list) {
      if (p.mode !== "joy") { p.trail.push([p.x, p.y]); if (p.trail.length > 14) p.trail.shift(); continue; }
      const k = Math.min(1, dt * 10), sp = .5;
      p.vx += (p.joy.x * sp - p.vx) * k; p.vy += (p.joy.y * sp - p.vy) * k;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.x < R) { p.x = R; p.vx = Math.abs(p.vx); } if (p.x > A - R) { p.x = A - R; p.vx = -Math.abs(p.vx); }
      if (p.y < R) { p.y = R; p.vy = Math.abs(p.vy); } if (p.y > 1 - R) { p.y = 1 - R; p.vy = -Math.abs(p.vy); }
      for (const s of stars) if (Math.hypot(s.x - p.x, s.y - p.y) < R + .03) collect(p, s);
    }
    const joys = list.filter(p => p.mode === "joy");
    for (let i = 0; i < joys.length; i++) for (let j = i + 1; j < joys.length; j++) {
      const a = joys[i], b = joys[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d > 0 && d < R * 2) {
        const nx = dx / d, ny = dy / d, o = (R * 2 - d) / 2;
        a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
        const rel = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
        if (rel > 0) { a.vx -= rel * nx * 1.4; a.vy -= rel * ny * 1.4; b.vx += rel * nx * 1.4; b.vy += rel * ny * 1.4; }
        const key = b.id; if (t - (a.bumpAt[key] || 0) > 400) { a.bumpAt[key] = t; buzz(a, 25); buzz(b, 25); fx.push({ x: a.x + nx * R, y: a.y + ny * R, c: "#fff", t, r: .04 }); }
      }
    }
    for (const p of list) if (t - p.lastSeen > 15000) removePlayer(p);
    draw(t);
    requestAnimationFrame(step);
  }

  function draw(t) {
    const S = H; // world unit = screen height
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(255,255,255,.04)"; ctx.lineWidth = 1;
    for (let gx = 0; gx < W; gx += S / 10) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
    for (let gy = 0; gy < H; gy += S / 10) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }
    for (const s of stars) {
      const pulse = 1 + Math.sin(t / 250 + s.x * 10) * .08, r = .03 * S * pulse * Math.min(1, (t - s.born) / 250);
      ctx.save(); ctx.translate(s.x * S, s.y * S); ctx.rotate(t / 1500);
      ctx.shadowColor = "#ffc93c"; ctx.shadowBlur = 20; ctx.fillStyle = "#ffc93c"; ctx.beginPath();
      for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i], age = (t - f.t) / 400; if (age > 1) { fx.splice(i, 1); continue; }
      ctx.strokeStyle = f.c; ctx.globalAlpha = 1 - age; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(f.x * S, f.y * S, f.r * S * (.4 + age), 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.textAlign = "center"; ctx.font = `700 ${Math.round(S * .028)}px Barlow, sans-serif`;
    for (const p of Object.values(players)) {
      const x = p.x * S, y = p.y * S;
      if (p.mode === "joy") {
        const r = R * S;
        ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = now() - p.dashAt < 300 ? 30 : 8;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
        const sp = Math.hypot(p.vx, p.vy); if (sp > .02) { p.fx = p.vx / sp; p.fy = p.vy / sp; } const lx = p.fx ?? 0, ly = p.fy ?? 1;
        for (const side of [-1, 1]) {
          const ex = x + (-ly * side * .38 + lx * .3) * r, ey = y + (lx * side * .38 + ly * .3 - .15) * r;
          ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, ey, r * .24, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(ex + lx * r * .1, ey + ly * r * .1, r * .11, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = "#fff"; ctx.fillText(p.name, x, y + r + S * .035);
      } else {
        ctx.strokeStyle = p.color; ctx.lineCap = "round";
        for (let i = 1; i < p.trail.length; i++) {
          ctx.globalAlpha = i / p.trail.length * .6; ctx.lineWidth = i / p.trail.length * 6;
          ctx.beginPath(); ctx.moveTo(p.trail[i - 1][0] * S, p.trail[i - 1][1] * S); ctx.lineTo(p.trail[i][0] * S, p.trail[i][1] * S); ctx.stroke();
        }
        ctx.globalAlpha = 1; ctx.lineWidth = 4; const r = S * .028;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x - r * 1.6, y); ctx.lineTo(x - r * .5, y); ctx.moveTo(x + r * .5, y); ctx.lineTo(x + r * 1.6, y);
        ctx.moveTo(x, y - r * 1.6); ctx.lineTo(x, y - r * .5); ctx.moveTo(x, y + r * .5); ctx.lineTo(x, y + r * 1.6); ctx.stroke();
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.fillText(p.name, x, y + r + S * .045);
      }
    }
    if (!Object.keys(players).length) {
      ctx.fillStyle = "rgba(243,245,255,.6)"; ctx.font = `700 ${Math.round(S * .045)}px Barlow, sans-serif`;
      ctx.fillText("Scan the QR code with a phone to join", W / 2, H / 2);
    }
  }

  function drawList() {
    const list = Object.values(players);
    $("#plist").innerHTML = list.map(p => `<div class="prow"><span class="dot" style="background:${p.color}"></span><b>${esc(p.name)}</b><span class="score">${p.score}</span>
      <div class="meta"><span>${MODES[p.mode]}</span><span>${p.via === "direct" ? "⚡ Direct" : "☁️ Cloud"}</span>
      <span class="ping ${pingClass(p.rtt)}">${p.rtt == null ? "– ms" : Math.round(p.rtt) + " ms"}</span><span>${p.ips}/s</span></div></div>`).join("")
      || `<div class="note">No players yet.</div>`;
    $("#conn").textContent = conn;
  }
  setInterval(() => { Object.values(players).forEach(p => { p.ips = p.ins; p.ins = 0; }); drawList(); }, 1000);

  try {
    await chan("pad-" + room, m => { if (m && m.t === "join" && m.id) addPlayer(m); });
    conn = LOCAL ? "Local test mode" : "Connected";
  } catch (e) { conn = "Couldn't connect. Check the internet and reload."; }
  drawList();
  requestAnimationFrame(step);
}

// ======================================================================
// Phone
// ======================================================================
async function padMain(codeRaw) {
  document.body.className = "pad";
  const room = String(codeRaw || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
  if (room.length !== 4) return home();
  let name = ls.get("padtest_name", "");
  const id = ls.get("padtest_id", null) || uid(); ls.set("padtest_id", id);

  if (!name) {
    app.innerHTML = `<div class="home"><h1 class="disp">Join ${esc(room)}</h1><input id="nm" maxlength="16" placeholder="Your name"><button class="btn big gold" id="go">Join</button></div>`;
    await new Promise(res => {
      const go = () => { const v = $("#nm").value.trim(); if (v) { name = v; ls.set("padtest_name", v); res(); } };
      $("#go").onclick = go; $("#nm").onkeydown = e => { if (e.key === "Enter") go(); }; $("#nm").focus();
    });
  }

  let mode = ls.get("padtest_mode", "joy"), route = "cloud", color = "#9097c0", welcomed = false, lastPong = 0;
  let pc = null, dc = null, directState = "";
  const rtts = []; let rtt = null;
  const joy = { x: 0, y: 0 }, sent = { x: 0, y: 0, t: 0 }, acc = { dx: 0, dy: 0 };
  let sens = ls.get("padtest_sens", 1), flip = ls.get("padtest_flip", false), airOn = false;
  let own = null, ctl = null;

  app.innerHTML = `<div class="padwrap">
    <div class="ptop"><span class="dot" id="dot"></span><b>${esc(name)}</b><span class="pill" id="pill">Connecting…</span></div>
    <div class="tabs">${Object.entries(MODES).map(([k, v]) => `<button class="chip" data-mode="${k}">${v}</button>`).join("")}</div>
    <div class="area" id="area"></div>
    <div class="pbottom"><div class="small" id="extra"></div><button class="abtn" id="abtn">A</button></div>
  </div>`;
  const area = $("#area");

  const dcOpen = () => dc && dc.readyState === "open";
  function send(m) {
    if (dcOpen()) { try { dc.send(JSON.stringify(m)); return; } catch (e) { } }
    own && own.send(m);
  }
  function pill() {
    const via = dcOpen() ? "⚡ Direct" : "☁️ Cloud";
    const p = $("#pill");
    if (!welcomed) { p.textContent = own ? "Finding the screen…" : "Connecting…"; p.className = "pill"; return; }
    p.textContent = `${via} ${rtt == null ? "" : Math.round(rtt) + " ms"}${directState ? " · " + directState : ""}`;
    p.className = "pill " + pingClass(rtt);
    $("#dot").style.background = color;
  }

  // ----- direct link -----
  async function startDirect() {
    if (pc) return;
    directState = "linking";
    pc = new RTCPeerConnection({ iceServers: ICE });
    const myPc = pc;
    dc = pc.createDataChannel("pad", { ordered: false, maxRetransmits: 0 });
    dc.onopen = () => { directState = ""; rtts.length = 0; pill(); };
    dc.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (_) { return; } onTv(m); };
    pc.onconnectionstatechange = () => { if (myPc === pc && ["failed", "disconnected", "closed"].includes(pc.connectionState)) { stopDirect(); directState = "direct failed"; pill(); } };
    try {
      await pc.setLocalDescription(await pc.createOffer());
      await iceDone(pc);
      if (myPc === pc) own.send({ t: "offer", sdp: pc.localDescription.sdp });
    } catch (e) { stopDirect(); directState = "direct failed"; }
    setTimeout(() => { if (myPc === pc && !dcOpen()) { stopDirect(); directState = "direct failed"; pill(); } }, 10000);
  }
  function stopDirect() { try { pc && pc.close(); } catch (e) { } pc = null; dc = null; directState = ""; rtts.length = 0; }
  function setRoute(r) { route = r; if (r === "direct") startDirect(); else stopDirect(); pill(); }

  function onTv(m) {
    switch (m.t) {
      case "welcome": welcomed = true; lastPong = now(); color = m.color || color; if (m.route !== route || (m.route === "direct" && !pc)) setRoute(m.route); send({ t: "mode", mode }); pill(); break;
      case "route": setRoute(m.route); break;
      case "pong": { const r = now() - m.s; if (r >= 0 && r < 5000) { rtts.push(r); if (rtts.length > 5) rtts.shift(); rtt = rtts.reduce((a, b) => a + b, 0) / rtts.length; } lastPong = now(); pill(); break; }
      case "answer": if (pc && pc.signalingState === "have-local-offer") pc.setRemoteDescription({ type: "answer", sdp: m.sdp }).catch(() => { }); break;
      case "buzz": if (navigator.vibrate) navigator.vibrate(m.ms || 30); area.classList.remove("flash"); void area.offsetWidth; area.classList.add("flash"); break;
    }
  }

  // ----- controls -----
  function setMode(m) {
    mode = m; ls.set("padtest_mode", m);
    document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
    joy.x = joy.y = 0; acc.dx = acc.dy = 0;
    if (welcomed) send({ t: "mode", mode: m });
    buildArea();
  }
  document.querySelector(".tabs").onclick = e => { const b = e.target.closest("[data-mode]"); if (b) setMode(b.dataset.mode); };

  function buildArea() {
    area.innerHTML = ""; area.onpointerdown = area.onpointermove = area.onpointerup = area.onpointercancel = null;
    const extra = $("#extra");
    if (mode === "joy") {
      extra.innerHTML = "";
      area.innerHTML = `<div class="hint">Put your thumb anywhere here and drag</div><div class="base hidden" id="base"></div><div class="knob hidden" id="knob"></div>`;
      const base = $("#base"), knob = $("#knob"), RAD = 70; let cx = 0, cy = 0, pid = null;
      area.onpointerdown = e => {
        if (pid != null) return; pid = e.pointerId; area.setPointerCapture(pid);
        const r = area.getBoundingClientRect(); cx = e.clientX - r.left; cy = e.clientY - r.top;
        base.style.left = knob.style.left = cx + "px"; base.style.top = knob.style.top = cy + "px";
        base.classList.remove("hidden"); knob.classList.remove("hidden"); area.querySelector(".hint").style.opacity = 0;
      };
      area.onpointermove = e => {
        if (e.pointerId !== pid) return;
        const r = area.getBoundingClientRect(); let dx = e.clientX - r.left - cx, dy = e.clientY - r.top - cy;
        const d = Math.hypot(dx, dy); if (d > RAD) { dx *= RAD / d; dy *= RAD / d; }
        knob.style.left = cx + dx + "px"; knob.style.top = cy + dy + "px";
        joy.x = Math.round(dx / RAD * 100) / 100; joy.y = Math.round(dy / RAD * 100) / 100;
      };
      area.onpointerup = area.onpointercancel = e => {
        if (e.pointerId !== pid) return; pid = null; joy.x = joy.y = 0;
        base.classList.add("hidden"); knob.classList.add("hidden");
      };
    } else if (mode === "pad") {
      extra.innerHTML = `<button class="btn" id="ctr">⌖ Centre</button>`;
      area.innerHTML = `<div class="hint">Slide your finger like a laptop touchpad</div>`;
      let pid = null, lx = 0, ly = 0;
      area.onpointerdown = e => { if (pid != null) return; pid = e.pointerId; area.setPointerCapture(pid); lx = e.clientX; ly = e.clientY; };
      area.onpointermove = e => {
        if (e.pointerId !== pid) return;
        const w = area.clientWidth; acc.dx += (e.clientX - lx) / w * 1.3 * sens; acc.dy += (e.clientY - ly) / w * 1.3 * sens; lx = e.clientX; ly = e.clientY;
      };
      area.onpointerup = area.onpointercancel = e => { if (e.pointerId === pid) pid = null; };
    } else {
      extra.innerHTML = `<button class="btn" id="ctr">⌖ Centre</button><button class="btn" id="flp">⇆ Flip</button>`;
      area.innerHTML = `<div class="hint" id="airhint">${airOn ? "Point the top of your phone at the TV and move it like a laser pointer.<br><br>Press Centre to bring the pointer back to the middle." : ""}</div>`;
      if (!airOn) {
        const b = document.createElement("button"); b.className = "btn gold"; b.textContent = "Start air pointer";
        b.style.cssText = "position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)";
        b.onclick = async () => {
          try { if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === "function" && await DeviceMotionEvent.requestPermission() !== "granted") throw 0; }
          catch (e) { b.textContent = "Motion not allowed"; return; }
          airOn = true; addEventListener("devicemotion", onMotion); buildArea();
          setTimeout(() => { if (!gotMotion) $("#airhint").innerHTML = "This phone isn't sending motion data, so the air pointer won't work on it. Try the touchpad."; }, 2000);
        };
        area.appendChild(b);
      }
      $("#flp").onclick = () => { flip = !flip; ls.set("padtest_flip", flip); };
    }
    const c = $("#ctr"); if (c) c.onclick = () => send({ t: "centre" });
  }
  let lastMotion = 0, gotMotion = false;
  function onMotion(e) {
    if (mode !== "air") return;
    const r = e.rotationRate; if (!r || r.alpha == null) return;
    gotMotion = true;
    const t = now(), dt = lastMotion ? Math.min(.1, (t - lastMotion) / 1000) : 0; lastMotion = t;
    const dz = v => Math.abs(v) < 2 ? 0 : v;
    const yaw = dz(r.alpha), pitch = dz(r.beta);
    acc.dx += (flip ? 1 : -1) * yaw * dt / 45 * sens;
    acc.dy += -pitch * dt / 45 * sens;
  }

  const abtn = $("#abtn");
  abtn.onpointerdown = e => { e.preventDefault(); abtn.classList.add("down"); if (navigator.vibrate) navigator.vibrate(8); send({ t: "btn", b: "A", down: true }); };
  abtn.onpointerup = abtn.onpointercancel = abtn.onpointerleave = () => abtn.classList.remove("down");

  // ----- send loop -----
  let lastSend = 0;
  function tick() {
    const t = now();
    if (welcomed && t - lastSend >= (dcOpen() ? 0 : CLOUD_GAP)) {
      if (mode === "joy") {
        if (joy.x !== sent.x || joy.y !== sent.y || t - sent.t > 600) { send({ t: "in", k: "joy", x: joy.x, y: joy.y }); sent.x = joy.x; sent.y = joy.y; sent.t = t; lastSend = t; }
      } else if (Math.abs(acc.dx) > 1e-4 || Math.abs(acc.dy) > 1e-4) {
        send({ t: "in", k: "ptr", dx: Math.round(acc.dx * 1e4) / 1e4, dy: Math.round(acc.dy * 1e4) / 1e4 }); acc.dx = acc.dy = 0; lastSend = t;
      }
    }
    requestAnimationFrame(tick);
  }

  setMode(mode);
  try {
    own = await chan("pad-" + room + "-" + id, onTv);
    ctl = await chan("pad-" + room, () => { });
  } catch (e) { $("#pill").textContent = "No connection"; return; }
  pill();
  setInterval(() => {
    if (!welcomed) { ctl.send({ t: "join", id, name, mode }); return; }
    send({ t: "ping", s: now(), rtt });
    if (now() - lastPong > 6000) { welcomed = false; stopDirect(); pill(); }
  }, 1000);
  ctl.send({ t: "join", id, name, mode });
  requestAnimationFrame(tick);
  try { if (navigator.wakeLock) { let wl = await navigator.wakeLock.request("screen"); document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible") try { wl = await navigator.wakeLock.request("screen"); } catch (e) { } }); } } catch (e) { }
  addEventListener("pagehide", () => { try { send({ t: "bye" }); } catch (e) { } });
}
</script>
