*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--wall);color:var(--fg);font-family:var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

.plaque{margin:2.4vh auto 0;width:max-content;max-width:90%;padding:1vh 3vh 1.2vh;text-align:center;border-radius:4px;color:#2a1d02;

.prow{display:flex;align-items:center;gap:.6em;padding:.45em .7em;border-radius:.7em;background:var(--panel);border:2px solid var(--line)}

.gallery{flex:1;display:flex;flex-wrap:wrap;gap:3vh 2.4vw;align-content:center;justify-content:center;overflow:auto;padding:1vh}

.cwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 .6em}

.tools{flex:none;display:flex;flex-direction:column;gap:.5em;padding:.7em .8em 1em}

.sw{width:2.1rem;height:2.1rem;border-radius:50%;border:3px solid var(--line)}
.sw.on{border-color:var(--fg);transform:scale(1.15)}

.sz{display:inline-block;border-radius:50%;background:var(--fg)}

// ===== Answer checking =====
const words = s => " " + String(s || "").toLowerCase().normalize("NFD").replace(/\p{M}/gu, "").replace(/[^a-z0-9 ]/g, " ").replace(/\b(a|an|the|some|its|is|it)\b/g, " ").replace(/\s+/g, " ").trim() + " ";
const norm = s => words(s).replace(/ /g, "");
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function check(guess, word) {
  const a = norm(guess), b = norm(word);
  if (!a) return "no";
  if (a === b || a === b + "s" || a === b + "es" || a + "s" === b) return "yes";
  const wa = words(guess), wb = words(word).trim();
  if (wb.length >= 3 && (wa.includes(" " + wb + " ") || wa.includes(" " + wb + "s ")) && a.length <= b.length + 10) return "yes";
  const d = lev(a, b);
  if (b.length >= 5 && d <= 1) return "yes";
  if (b.length >= 8 && d <= 2) return "yes";
  if (d <= 2 || (b.length >= 6 && d <= 3)) return "close";
  return "no";
}

// ===== Transport (same as Buzz In) =====
async function connect(room, onMsg, onStatus) {
  if (LOCAL) {
    const bc = new BroadcastChannel("doodle-" + room);
    bc.onmessage = e => onMsg(e.data);
    onStatus && onStatus("ok");
    return { send: m => bc.postMessage(m) };
  }
  const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, { realtime: { params: { eventsPerSecond: 30 } } });
  const ch = sb.channel("doodle-" + room, { config: { broadcast: { self: false } } });
  ch.on("broadcast", { event: "m" }, ({ payload }) => onMsg(payload));
  await new Promise((res, rej) => {
    let done = false;
    ch.subscribe(st => {
      if (st === "SUBSCRIBED") { onStatus && onStatus("ok"); if (!done) { done = true; res(); } }
      else if (st === "CHANNEL_ERROR" || st === "TIMED_OUT" || st === "CLOSED") { onStatus && onStatus("lost"); if (!done) { done = true; rej(new Error(st)); } }
    });
  });
  return { send: m => ch.send({ type: "broadcast", event: "m", payload: m }) };
}

// stroke drawing shared by TV and phone. Stroke: {c, w (per 1000 of width), p:[x,y,x,y...] normalised 0..1}
function drawStroke(ctx, s, W, H) {
  const p = s.p; if (!p || p.length < 2) return;
  ctx.strokeStyle = ctx.fillStyle = s.c; ctx.lineWidth = Math.max(1, s.w / 1000 * W); ctx.lineCap = ctx.lineJoin = "round";
  if (p.length === 2) { ctx.beginPath(); ctx.arc(p[0] * W, p[1] * H, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); return; }
  ctx.beginPath(); ctx.moveTo(p[0] * W, p[1] * H);
  for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i] * W, p[i + 1] * H);
  ctx.stroke();
}

}

// ======================================================================
// TV — runs the game
// ======================================================================
async function tvMain() {
  document.body.className = "tv";
  const room = (P.get("tv") || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4) || code4();
  history.replaceState(null, "", "?tv=" + room + (LOCAL ? "&local=1" : ""));
  const joinUrl = location.origin + location.pathname + "?join=" + room + (LOCAL ? "&local=1" : "");
  const S = {
    phase: "lobby", players: {}, order: [], settings: Object.assign({ guess: "type", who: "all", laps: 1, time: 80, edition: new Date().getMonth() === 11 ? "xmas" : "std" }, ls.get("doodle_settings", {})),
    queue: [], turnNo: 0, totalTurns: 0, turn: null, gallery: [], feed: [], revealUntil: 0,
  };
  let conn = "Connecting…", link = null, colorI = 0, lastKey = "";
  const strokes = new Map(); let dirty = true;

  const send = m => link && link.send(m);
  const alive = p => now() - p.seen < 20000;
  const plays = p => S.settings.who === "kids" ? p.kid : true;
  const eligible = () => S.order.map(id => S.players[id]).filter(p => p && plays(p));
  const hostId = () => (S.order.map(id => S.players[id]).find(p => p && alive(p)) || {}).id || null;

  // ---- state for phones ----
  function pub() {
    const t = S.turn;
    const left = t ? (t.paused != null ? t.paused : Math.max(0, t.endsAt - now())) : 0;
    return {
      phase: S.phase, settings: S.settings, host: hostId(), turnNo: S.turnNo, total: S.totalTurns,
      players: S.order.map(id => S.players[id]).filter(Boolean).map(p => ({ id: p.id, name: p.name, kid: p.kid, color: p.color, score: p.score })),
      drawer: t && t.drawer, left, paused: !!(t && t.paused != null), dur: t ? t.dur : 0,
      hint: t && t.word && S.settings.guess === "type" ? hint(t) : null,
      got: t ? t.got : {}, buzz: t && t.buzz, wrong: t ? Object.keys(t.wrong) : [],
      kc: t && t.kc ? t.kc : null,
      reveal: S.phase === "reveal" && t ? { w: t.word && t.word.w, e: t.word && t.word.e, skipped: !!t.skipped, dpts: t.dpts } : null,
    };
  }
  let pushT = null;
  const needSecret = new Set();
  function push() { clearTimeout(pushT); pushT = setTimeout(() => { send({ t: "state", st: pub() }); needSecret.forEach(id => secret(S.players[id])); needSecret.clear(); render(); }, 40); }
  function secret(p) {
    const t = S.turn; if (!t || !p || t.drawer !== p.id) return;
    if (S.phase === "choose") send({ t: "secret", to: p.id, opts: t.opts });
    if (S.phase === "draw" || S.phase === "reveal") send({ t: "secret", to: p.id, word: t.word });
  }

  function hint(t) {
    const w = t.word.w, frac = 1 - Math.max(0, (t.paused != null ? t.paused : t.endsAt - now())) / t.dur;
    const letters = [...w].map((c, i) => c === " " ? -1 : i).filter(i => i >= 0);
    const show = frac > .75 ? 2 : frac > .5 ? 1 : 0;
    const keep = new Set(t.hintOrder.slice(0, Math.min(show, Math.max(0, letters.length - 2))));
    return [...w].map((c, i) => c === " " ? "  " : keep.has(i) ? c.toUpperCase() : "_").join(" ");
  }

  // ---- game flow ----
  function start() {
    const el = eligible();
    if (el.length < 2) return;
    ls.set("doodle_settings", S.settings);
    S.order.forEach(id => S.players[id] && (S.players[id].score = 0));
    S.gallery = []; S.feed = []; S.turnNo = 0;
    S.queue = []; for (let i = 0; i < S.settings.laps; i++) S.queue.push(...el.map(p => p.id));
    S.totalTurns = S.queue.length;
    nextTurn();
  }
  function playAgain() { if (eligible().length >= 2) start(); else toLobby(); }
  function toLobby() { S.phase = "lobby"; S.turn = null; push(); }
  function nextTurn() {
    let id; while ((id = S.queue.shift())) { const p = S.players[id]; if (p && alive(p) && plays(p)) break; }
    if (!id) { S.phase = "end"; S.turn = null; feedAdd(""); push(); return; }
    const p = S.players[id];
    S.turnNo++;
    const used = new Set(S.gallery.map(g => g.w));
    const xm = S.settings.edition === "xmas", E = xm ? XEASY : EASY, Hd = xm ? XHARD : HARD;
    let pool = (p.kid ? E : shuffle(Hd).slice(0, 40).concat(shuffle(E).slice(0, xm ? 14 : 10))).filter(x => !used.has(x.w));
    if (pool.length < 3) pool = p.kid ? E.slice() : Hd.concat(E);
    S.turn = { drawer: id, opts: shuffle(pool).slice(0, 3), word: null, got: {}, wrong: {}, kidWrong: {}, buzz: null, paused: null, dpts: 0, chooseEnds: now() + 20000 };
    strokes.clear(); dirty = true;
    S.phase = "choose"; S.feed = [];
    needSecret.add(id); push();
  }
  function choose(i) {
    const t = S.turn; if (S.phase !== "choose" || !t.opts[i]) return;
    t.word = t.opts[i];
    const p = S.players[t.drawer];
    t.dur = (S.settings.time + (p && p.kid ? 20 : 0)) * 1000; t.endsAt = now() + t.dur;
    t.hintOrder = shuffle([...t.word.w].map((c, j) => c === " " ? -1 : j).filter(j => j >= 0));
    const xm = S.settings.edition === "xmas", E = xm ? XEASY : EASY, Hd = xm ? XHARD : HARD;
    const same = (E.some(x => x.w === t.word.w) ? E : E.concat(Hd)).filter(x => x.e !== t.word.e);
    t.kc = shuffle([t.word].concat(shuffle(same.filter(x => x.w !== t.word.w)).slice(0, 3)));
    S.phase = "draw";
    needSecret.add(t.drawer); push();
  }
  const frac = t => Math.max(0, (t.paused != null ? t.paused : t.endsAt - now())) / t.dur;
  const pts = t => 50 + Math.round(50 * frac(t));
  function award(p, n) { const t = S.turn; t.got[p.id] = n; p.score += n; }
  function drawerBonus(n) { const t = S.turn, d = S.players[t.drawer]; if (d) { d.score += n; t.dpts += n; } }
  function guessers() { const t = S.turn; return eligible().filter(p => p.id !== t.drawer && alive(p)); }
  function maybeAllGot() { const g = guessers(); if (g.length && g.every(p => S.turn.got[p.id] != null)) endTurn(); }

  function endTurn(skipped) {
    const t = S.turn; if (!t || S.phase === "reveal") return;
    t.skipped = !!skipped; t.paused = null;
    if (t.word && !skipped && strokes.size) {
      const c = document.createElement("canvas"); c.width = 600; c.height = 800;
      const x = c.getContext("2d"); x.fillStyle = "#fffdf8"; x.fillRect(0, 0, 600, 800);
      strokes.forEach(s => drawStroke(x, s, 600, 800));
      const d = S.players[t.drawer];
      S.gallery.push({ w: t.word.w, e: t.word.e, by: d ? d.name : "", color: d ? d.color : "#fff", xmas: S.settings.edition === "xmas", img: c.toDataURL("image/jpeg", .88) });
    }
    if (t.word && !skipped) { const n = Object.keys(t.got).length; feedAdd(n ? "" : "Nobody got it this time"); }
    S.phase = "reveal"; S.revealUntil = now() + (skipped ? 3500 : 7000);
    push();
  }
  function feedAdd(html, ok) { if (!html) return; S.feed.push({ html, ok }); if (S.feed.length > 7) S.feed.shift(); }

  function onGuess(p, text) {
    const t = S.turn; if (S.phase !== "draw" || !t || t.drawer === p.id || !plays(p) || t.got[p.id] != null || p.kid) return;
    if (S.settings.guess !== "type") return;
    const r = check(text, t.word.w);
    if (r === "yes") { const n = pts(t); award(p, n); drawerBonus(20); feedAdd(`${esc(p.name)} got it! +${n}`, true); push(); maybeAllGot(); }
    else if (r === "close") { send({ t: "close", to: p.id }); }
    else { feedAdd(`<b>${esc(p.name)}:</b> ${esc(String(text).slice(0, 30))}`); render(); }
  }
  function onKidPick(p, i) {
    const t = S.turn; if (S.phase !== "draw" || !t || !t.kc || t.drawer === p.id || !plays(p) || t.got[p.id] != null || t.buzz) return;
    const c = t.kc[i]; if (!c) return;
    if (c.w === t.word.w) {
      const n = Math.max(20, pts(t) - 15 * (t.kidWrong[p.id] || 0));
      award(p, n); drawerBonus(S.settings.guess === "buzz" ? 40 : 20);
      feedAdd(`${esc(p.name)} got it! +${n}`, true); push();
      if (S.settings.guess === "buzz") endTurn(); else maybeAllGot();
    } else { t.kidWrong[p.id] = (t.kidWrong[p.id] || 0) + 1; send({ t: "nope", to: p.id, i }); }
  }
  function onBuzz(p) {
    const t = S.turn; if (S.phase !== "draw" || !t || t.buzz || t.drawer === p.id || !plays(p) || p.kid || t.wrong[p.id] || S.settings.guess !== "buzz") return;
    t.buzz = p.id; t.paused = Math.max(0, t.endsAt - now()); t.buzzAt = now();
    push();
  }
  function judge(ok) {
    const t = S.turn; if (S.phase !== "draw" || !t || !t.buzz) return;
    const p = S.players[t.buzz];
    if (ok && p) { const n = pts(t); award(p, n); drawerBonus(40); feedAdd(`${esc(p.name)} got it! +${n}`, true); t.buzz = null; endTurn(); return; }
    if (p) { t.wrong[p.id] = 1; feedAdd(`${esc(p.name)} buzzed… not quite!`); }
    t.buzz = null; t.endsAt = now() + (t.paused || 0); t.paused = null;
    push();
  }

  function onMsg(m) {
    if (!m || !m.t || m.t === "state" || m.t === "secret" || m.t === "close" || m.t === "nope") return;
    const p = m.id && S.players[m.id];
    if (m.t === "join" && m.id) {
      let q = S.players[m.id];
      if (!q) { q = S.players[m.id] = { id: m.id, color: COLORS[colorI++ % COLORS.length], score: 0 }; S.order.push(m.id); }
      q.name = String(m.name || "Player").slice(0, 16); q.kid = !!m.kid; q.seen = now();
      needSecret.add(q.id); push(); return;
    }
    if (!p) { if (m.id) send({ t: "rejoin", to: m.id }); return; }
    p.seen = now();
    const isHost = m.id === hostId(), t = S.turn;
    switch (m.t) {
      case "hi": break;
      case "set": if (isHost && (S.phase === "lobby" || S.phase === "end") && SETS.some(x => x[0] === m.k && x[2].some(v => v[0] === m.v))) { S.settings[m.k] = m.v; push(); } break;
      case "start": if (isHost && S.phase === "lobby") start(); break;
      case "again": if (isHost && S.phase === "end") playAgain(); break;
      case "lobby": if (isHost && S.phase === "end") toLobby(); break;
      case "skip": if ((isHost || (t && t.drawer === m.id)) && (S.phase === "draw" || S.phase === "choose")) endTurn(true); break;
      case "choose": if (t && t.drawer === m.id) choose(m.i); break;
      case "ink": if (S.phase === "draw" && t && t.drawer === m.id) { for (const [sid, c, w, pp] of (m.ops || []).slice(0, 50)) { let s = strokes.get(sid); if (!s) strokes.set(sid, s = { c: String(c).slice(0, 9), w: +w || 12, p: [] }); if (Array.isArray(pp)) s.p.push(...pp.slice(0, 2000)); } dirty = true; } break;
      case "undo": if (t && t.drawer === m.id) { strokes.delete(m.sid); dirty = true; } break;
      case "clear": if (t && t.drawer === m.id) { strokes.clear(); dirty = true; } break;
      case "guess": onGuess(p, m.text); break;
      case "kpick": onKidPick(p, m.i); break;
      case "buzz": onBuzz(p); break;
      case "judge": if (t && t.drawer === m.id) judge(!!m.ok); break;
    }
  }

  // ---- timers ----
  setInterval(() => {
    const t = S.turn;
    if (S.phase === "choose" && t && now() > t.chooseEnds) choose(Math.random() * t.opts.length | 0);
    if (S.phase === "draw" && t) {
      if (t.paused == null && now() >= t.endsAt) endTurn();
      else if (t.buzz && now() - t.buzzAt > 25000) judge(false);
      const d = S.players[t.drawer]; if (d && now() - d.seen > 15000) { feedAdd(`${esc(d.name)} lost connection`); endTurn(true); }
      else updTimer();
    }
    if (S.phase === "reveal" && now() > S.revealUntil) nextTurn();
  }, 250);
  setInterval(() => send({ t: "state", st: pub() }), 3000); // heartbeat so phones know the TV is there

  // ---- rendering ----
  function render() {
    const key = S.phase + "|" + S.turnNo;
    if (key !== lastKey) { lastKey = key; build(); }
    upd();
  }
  function header() {
    return `<header class="tvtop"><div class="logo" id="logo"></div><div class="tinfo" id="tinfo"></div><div class="codesm">Join code <b>${room}</b></div></header>`;
  }
  function build() {
    const main = S.phase === "lobby" ? `<main class="tvmain">
        <div class="framecol"><div class="frame"><div class="mat"><div class="qrbox" id="qr"></div></div></div>
          <div class="plaque"><small>Now showing</small><b>Scan to join</b><div class="muted" style="color:#4a3606;font-weight:700">or go to the link and enter <b style="font-family:var(--display);font-size:1.3em;letter-spacing:.1em">${room}</b></div></div></div>
        <div class="panel"><h3>Artists</h3><div class="plist" id="plist"></div>

      : S.phase === "end" ? `<main class="end"><div class="gallery" id="gal"></div>
        <div class="panel"><h3 id="exh"></h3><div class="lobbynote">Tap a picture to save it as a framed print.</div><div class="plist podium" id="plist"></div>
          <div class="lobbynote" style="margin-top:.4em"><b style="color:var(--fg)">Next game</b> · change anything below, then play again. Same players, no need to rejoin.</div>

    if (S.phase === "lobby") { try { new QRCode($("#qr"), { text: joinUrl, width: 400, height: 400, correctLevel: QRCode.CorrectLevel.M }); } catch (e) { $("#qr").textContent = joinUrl; } }

      $("#gal").innerHTML = S.gallery.length ? S.gallery.map((g, i) => `<div class="mini" data-i="${i}" style="--h:${S.gallery.length > 8 ? 17 : S.gallery.length > 4 ? 23 : 34}vh;animation-delay:${i * .12}s"><div class="frame"><div class="mat"><img src="${g.img}" alt="${esc(g.w)}"></div></div><div class="plaque"><b>${esc(g.w)}</b><small>by ${esc(g.by)}</small></div></div>`).join("") : `<div class="muted">No pictures this time.</div>`;

  }
  function upd() {
    festive(S.settings.edition === "xmas", 60);
    const lg = $("#logo"); if (lg) lg.innerHTML = `Doodle <span>Gallery</span>${S.settings.edition === "xmas" ? " 🎄" : ""}`;
    const list = S.order.map(id => S.players[id]).filter(Boolean), t = S.turn;
    const sorted = S.phase === "lobby" ? list : list.slice().sort((a, b) => b.score - a.score);
    const pl = $("#plist");
    if (pl) pl.innerHTML = sorted.map((p, i) => {
      const watching = !plays(p), got = t && t.got[p.id] != null, drawer = t && t.drawer === p.id;
      return `<div class="prow ${got ? "got" : ""} ${drawer && S.phase !== "end" ? "drawer" : ""} ${!alive(p) || watching ? "off" : ""}"><span class="dot" style="background:${p.color}"></span>

        ${drawer && S.phase !== "end" ? "🎨" : got ? "✅" : ""}${S.phase === "lobby" ? "" : `<span class="sc">${p.score}</span>`}</div>`;
    }).join("") || `<div class="lobbynote">Nobody yet. Scan the code with a phone.</div>`;
    const ti = $("#tinfo"); if (ti) ti.textContent = S.phase === "lobby" || S.phase === "end" ? "" : `Picture ${S.turnNo} of ${S.totalTurns}`;
    if (S.phase === "lobby") {

      $("#snote").textContent = n < 2 ? (S.settings.who === "kids" ? "Needs at least 2 kids (tick “a child is playing” when joining)." : "Needs at least 2 players.") : `${n} artists ready. The first player to join can also start from their phone.`;
      $("#sets").onclick = e => { const b = e.target.closest("[data-set]"); if (b) { const { k, v } = setFromBtn(b); S.settings[k] = v; push(); } };

    }
    if (S.phase === "end") {
      $("#exh").textContent = S.gallery.length && S.gallery[0].xmas ? "The Christmas Exhibition" : "The Exhibition";
      $("#sets").innerHTML = setsHTML(S.settings);
      $("#sets").onclick = e => { const b = e.target.closest("[data-set]"); if (b) { const { k, v } = setFromBtn(b); S.settings[k] = v; push(); } };
      const n = eligible().length;
      $("#snote").textContent = n < 2 ? (S.settings.who === "kids" ? "Kids only needs at least 2 kids. Play again will open the lobby so more can join." : "Needs at least 2 players.") : "";
      $("#again").onclick = playAgain; $("#tolobby").onclick = toLobby;
      return;
    }

    const d = S.players[t.drawer], dn = d ? esc(d.name) : "";

      ov.innerHTML = strokes.size ? "" : `<div class="msg" style="opacity:.35">${dn} is drawing…</div>`;
    } else if (S.phase === "reveal") {
      pq.innerHTML = t.skipped ? `<small>Skipped</small><b>${dn}'s picture</b>` : `<small>It was</small><b>“${esc(t.word.w)}” ${t.word.e}</b><div style="font-weight:700">by ${dn}${t.dpts ? ` · +${t.dpts} for the artist` : ""}</div>`;
      ov.innerHTML = t.skipped ? `<div class="msg">Skipped</div>` : "";
      if (t.skipped) { strokes.clear(); dirty = true; }
    }
    $("#feed").innerHTML = S.feed.map(f => `<div class="${f.ok ? "ok" : ""}">${f.html}</div>`).join("");
    $("#skip").onclick = () => endTurn(true);
    $("#skip").classList.toggle("hidden", S.phase === "reveal");
    updTimer();
    const bov = $("#bov");
    if (S.phase === "draw" && t.buzz && S.players[t.buzz]) {
      const b = S.players[t.buzz];
      if (!bov.dataset.on || bov.dataset.on !== t.buzz) {
        bov.dataset.on = t.buzz;
        bov.innerHTML = `<div class="buzzov"><div class="buzzcard"><div style="font-size:4em">🔔</div><h2 style="color:${b.color}">${esc(b.name)} buzzed!</h2><div class="muted" style="font-size:1.3em">Say your answer out loud. ${dn} decides.</div>
          <div class="row"><button class="btn good big" data-j="1" style="width:auto">✓ Right</button><button class="btn bad big" data-j="0" style="width:auto">✗ Wrong</button></div></div></div>`;
        bov.onclick = e => { const j = e.target.closest("[data-j]"); if (j) judge(j.dataset.j === "1"); };
      }
    } else { bov.innerHTML = ""; bov.dataset.on = ""; }
  }
  function updTimer() {
    const el = $("#timer"), t = S.turn; if (!el || !t) return;
    if (S.phase === "draw") { const s = Math.ceil(Math.max(0, t.paused != null ? t.paused : t.endsAt - now()) / 1000); el.textContent = (t.paused != null ? "⏸ " : "") + s; el.classList.toggle("low", s <= 10); }
    else if (S.phase === "choose") { el.textContent = "🎨"; el.classList.remove("low"); }
    else el.textContent = "";

  }
  function paint() {
    const cv = $("#art");

      dirty = false; const x = cv.getContext("2d");

  requestAnimationFrame(paint);

  // framed print for the gallery
  function saveFramed(g) {
    const img = new Image();
    img.onload = () => {
      const W = 960, H = 1330, c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
      x.fillStyle = "#2a1820"; x.fillRect(0, 0, W, H);
      const fx = 80, fy = 70, fw = 800, fh = 1000;
      const gr = x.createLinearGradient(fx, fy, fx + fw, fy + fh);
      [["#7a5713", 0], ["#f6dc8c", .18], ["#b48a2c", .34], ["#fbe7a8", .5], ["#a07a26", .66], ["#f3d27a", .82], ["#6e4f12", 1]].forEach(([col, s]) => gr.addColorStop(s, col));
      x.fillStyle = gr; x.fillRect(fx, fy, fw, fh);
      x.fillStyle = "#f3ecdf"; x.fillRect(fx + 60, fy + 60, fw - 120, fh - 120);
      x.drawImage(img, fx + 100, fy + 100, fw - 200, fh - 200);
      const py = fy + fh + 50, pw = 600, px = (W - pw) / 2;
      const pg = x.createLinearGradient(0, py, 0, py + 150); pg.addColorStop(0, "#f8e3a0"); pg.addColorStop(.55, "#c9a24a"); pg.addColorStop(1, "#a9822d");

      const a = document.createElement("a"); a.href = c.toDataURL("image/png"); a.download = `${g.w} by ${g.by}.png`.replace(/[^\w .-]/g, ""); a.click();
    };
    img.src = g.img;
  }

  render();
  try {
    link = await connect(room, onMsg, st => { conn = st === "ok" ? (LOCAL ? "Local test mode" : "") : "Connection lost. Reload if phones stop working."; });
  } catch (e) { conn = "Couldn't connect. Check the internet and reload."; }
  lastKey = ""; render();
}

  function joinForm() {

    app.innerHTML = `<div class="home"><h1>Doodle <span>Gallery</span></h1><p class="muted">Game ${esc(room)}</p>

      <label class="check"><input type="checkbox" id="kid" ${me && me.kid ? "checked" : ""}> 🧒 A child is playing<br><span class="muted" style="font-weight:500;font-size:.9em">They'll draw from pictures and guess by tapping a picture, no reading needed.</span></label>
      <button class="btn big gold" id="go">Join</button></div>`;
    const go = () => { const v = $("#nm").value.trim(); if (!v) return $("#nm").focus(); me = { name: v, kid: $("#kid").checked }; ls.set("doodle_me", me); lastKey = ""; send({ t: "join", name: me.name, kid: me.kid }); render(); };
    $("#go").onclick = go; $("#nm").onkeydown = e => { if (e.key === "Enter") go(); };
  }

  function onMsg(m) {
    if (!m) return;
    if (m.t === "state") {
      const was = ST; ST = m.st; lastState = Date.now();
      localEnd = Date.now() + (ST.left || 0);
      if (!ST.players.some(p => p.id === id) && me) send({ t: "join", name: me.name, kid: me.kid });
      if (was && (was.turnNo !== ST.turnNo || was.phase !== ST.phase)) {
        if (was.turnNo !== ST.turnNo) { myGuesses = []; kidNo = new Set(); secretOpts = null; secretWord = null; myStrokes = []; pending.clear(); if (ST.drawer === id) buzzPhone([60, 60, 60]); }
      }
      if (ST.buzz && ST.drawer === id && !judgeShown) buzzPhone(120);
      if (was && ST.got[id] != null && was.got[id] == null) buzzPhone([40, 40, 120]);
      render(); return;
    }
    if (m.to !== id) return;
    if (m.t === "secret") { if (m.opts) secretOpts = m.opts; if (m.word) secretWord = m.word; lastKey = ""; render(); }
    if (m.t === "close") toast("So close!");
    if (m.t === "nope") { kidNo.add(m.i); buzzPhone(80); const el = document.querySelector(`[data-k="${m.i}"]`); if (el) { el.classList.add("no", "shake"); } }
    if (m.t === "rejoin" && me) send({ t: "join", name: me.name, kid: me.kid });
  }
  function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); buzzPhone(30); setTimeout(() => d.remove(), 1400); }

  const mine = () => ST && ST.players.find(p => p.id === id);
  const playsMe = () => { const p = mine(); return p && (ST.settings.who === "kids" ? p.kid : true); };
  function role() {
    if (!me) return "join";
    if (!ST || !mine()) return "wait";
    const ph = ST.phase;
    if (ph === "lobby") return "lobby";
    if (ph === "end") return "end";
    if (ph === "reveal") return "reveal";
    if (!playsMe()) return "watch";
    if (ST.drawer === id) return ph === "choose" ? "choose" : "draw";
    if (ph === "choose") return "waitdraw";

          <div class="trow">${[5, 12, 28].map(s => `<button class="btn ${pen.w === s ? "gold" : ""}" data-sz="${s}"><span class="sz" style="width:${s / 2 + 4}px;height:${s / 2 + 4}px"></span></button>`).join("")}

    on("#edit", () => joinForm());
    on("#start", () => send({ t: "start" }));
    on("#again", () => send({ t: "again" }));
    on("#tolobby", () => send({ t: "lobby" }));
    document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { send({ t: "choose", i: +b.dataset.c }); buzzPhone(20); });
    document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { if (!b.classList.contains("no")) { send({ t: "kpick", i: +b.dataset.k }); buzzPhone(15); } });
    on("#bz", () => { send({ t: "buzz" }); buzzPhone(60); });
    const gf = $("#gf");
    if (gf) gf.onsubmit = e => { e.preventDefault(); const v = $("#gi").value.trim(); if (!v) return; send({ t: "guess", text: v }); myGuesses.push(v); $("#gi").value = ""; upd(r); };
    const sets = $("#sets");
    if (sets) sets.onclick = e => { const b = e.target.closest("[data-set]"); if (b) { const { k, v } = setFromBtn(b); send({ t: "set", k, v }); } };
  }
  function upd(r) {
    festive(!!(ST && ST.settings.edition === "xmas"), 22);
    const tm = $("#ptm");
    if (tm) { const s = ST && ST.phase === "draw" ? Math.ceil(Math.max(0, ST.paused ? ST.left : localEnd - Date.now()) / 1000) : null; tm.textContent = s == null ? "" : (ST.paused ? "⏸" : "") + s; }
    if ((r === "lobby" || r === "end") && $("#sets")) {
      $("#sets").innerHTML = setsHTML(ST.settings);
      const n = ST.players.filter(p => ST.settings.who === "kids" ? p.kid : true).length;
      if ($("#start")) $("#start").disabled = n < 2;
      $("#snote").textContent = n < 2 ? (r === "end" ? "Not enough players for these settings yet. Play again will open the lobby." : "Waiting for more players…") : `${n} artists ready`;
    }
    if (r === "type") { const h = $("#hint"); if (h) h.textContent = ST.hint || ""; const m = $("#mine"); if (m) m.innerHTML = myGuesses.slice(-6).map(g => `<span class="chip">${esc(g)}</span>`).join(""); }
    if (r === "buzz") {
      const b = $("#bz"), s = $("#bzs"); if (!b) return;
      const wrong = ST.wrong.includes(id), other = ST.buzz && ST.buzz !== id, minebz = ST.buzz === id;
      b.disabled = wrong || !!ST.buzz;
      const bn = other ? (ST.players.find(x => x.id === ST.buzz) || {}).name : "";
      s.textContent = minebz ? "You buzzed! Say your answer out loud." : wrong ? "Not quite. Wait for the next picture." : other ? `${bn} buzzed…` : "Know what it is? Buzz, then say it out loud.";
    }
    if (r === "draw") {
      const j = $("#judge"); if (!j) return;
      if (ST.buzz) {
        if (!judgeShown) {
          judgeShown = true; const b = ST.players.find(x => x.id === ST.buzz) || {};
          j.innerHTML = `<div class="judge"><h3>🔔 ${esc(b.name)} buzzed!</h3><div class="muted">Did they say <b>${esc(secretWord ? secretWord.w : "it")}</b>?</div><div class="row"><button class="btn good" data-j="1">✓ Yes</button><button class="btn bad" data-j="0">✗ No</button></div></div>`;
          j.onclick = e => { const b2 = e.target.closest("[data-j]"); if (b2) send({ t: "judge", ok: b2.dataset.j === "1" }); };
        }
      } else if (judgeShown) { judgeShown = false; j.innerHTML = ""; }
    }
  }
  setInterval(() => { if (ST && (ST.phase === "draw")) { const t = $("#ptm"); if (t) upd(role()); } }, 250);

  // ---- drawing canvas ----
  function setupCanvas() {
    const cv = $("#pc"), wrap = $("#cwrap"); let W = 0, H = 0, DPR = 1, x = cv.getContext("2d");
    function fit() {
      const aw = wrap.clientWidth - 12, ah = wrap.clientHeight - 12;
      W = Math.max(50, Math.min(aw, ah * 3 / 4)); H = W * 4 / 3; DPR = window.devicePixelRatio || 1;
      cv.style.width = W + "px"; cv.style.height = H + "px"; cv.width = W * DPR; cv.height = H * DPR;
      x = cv.getContext("2d"); x.setTransform(DPR, 0, 0, DPR, 0, 0); redraw();
    }
    function redraw() { x.fillStyle = "#fffdf8"; x.fillRect(0, 0, W, H); myStrokes.forEach(s => drawStroke(x, s, W, H)); }
    fit(); addEventListener("resize", fit);
    let cur = null, pid = null;
    const pt = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 1000) / 1000, Math.round((e.clientY - r.top) / r.height * 1000) / 1000]; };
    cv.onpointerdown = e => {
      if (pid != null) return; pid = e.pointerId; cv.setPointerCapture(pid);
      cur = { sid: id.slice(0, 4) + (++sidN), c: pen.c, w: pen.w, p: pt(e) };
      myStrokes.push(cur); queue(cur, cur.p.slice()); drawStroke(x, cur, W, H);
    };
    cv.onpointermove = e => {
      if (e.pointerId !== pid || !cur) return;
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for (const ev of (evs.length ? evs : [e])) {
        const q = pt(ev), n = cur.p.length;
        if (Math.abs(q[0] - cur.p[n - 2]) + Math.abs(q[1] - cur.p[n - 1]) < .004) continue;
        x.strokeStyle = cur.c; x.lineWidth = Math.max(1, cur.w / 1000 * W); x.lineCap = x.lineJoin = "round";
        x.beginPath(); x.moveTo(cur.p[n - 2] * W, cur.p[n - 1] * H); x.lineTo(q[0] * W, q[1] * H); x.stroke();
        cur.p.push(...q); queue(cur, q);
      }
    };
    cv.onpointerup = cv.onpointercancel = e => { if (e.pointerId === pid) { pid = null; cur = null; flush(); } };
    document.querySelectorAll("[data-col]").forEach(b => b.onclick = () => { pen.c = b.dataset.col; document.querySelectorAll("[data-col]").forEach(z => z.classList.toggle("on", z === b)); document.querySelectorAll(".trow [data-col]").forEach(z => z.classList.toggle("gold", z === b)); });
    document.querySelectorAll("[data-sz]").forEach(b => b.onclick = () => { pen.w = +b.dataset.sz; document.querySelectorAll("[data-sz]").forEach(z => z.classList.toggle("gold", z === b)); });
    $("#undo").onclick = () => { const s = myStrokes.pop(); if (s) { pending.delete(s.sid); send({ t: "undo", sid: s.sid }); redraw(); } };
    $("#clr").onclick = () => { myStrokes = []; pending.clear(); send({ t: "clear" }); redraw(); };
    $("#dskip").onclick = () => { if (confirm("Skip this picture? Nobody scores for it.")) send({ t: "skip" }); };
  }
  function queue(s, pts) { let q = pending.get(s.sid); if (!q) pending.set(s.sid, q = { c: s.c, w: s.w, p: [] }); q.p.push(...pts); }
  function flush() {
    if (!pending.size) return;
    const ops = []; pending.forEach((q, sid) => ops.push([sid, q.c, q.w, q.p])); pending.clear();
    send({ t: "ink", ops });
  }
  setInterval(flush, 100);

  // ---- start ----
  if (!me) joinForm(); else render();
  try { link = await connect(room, onMsg); } catch (e) { app.innerHTML = `<div class="home"><h2>Couldn't connect</h2><p class="muted">Check your internet and try again.</p><button class="btn gold" onclick="location.reload()">Try again</button></div>`; return; }
  if (me) send({ t: "join", name: me.name, kid: me.kid });
  setInterval(() => {
    if (!me) return;
    if (Date.now() - lastState > 8000) send({ t: "join", name: me.name, kid: me.kid });
    else send({ t: "hi" });
  }, 3000);
  try { if (navigator.wakeLock) { let wl = await navigator.wakeLock.request("screen"); document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible") try { wl = await navigator.wakeLock.request("screen"); } catch (e) { } }); } } catch (e) { }
}
</script>
</body>
</html>
